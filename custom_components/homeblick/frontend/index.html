<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HomeView</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..700&family=Roboto+Flex:opsz,wdth,wght,XOPQ,YOPQ,YTFI@144,25..151,400..500,27..175,25..135,560..788&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font:400 16px Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center}
button,input{font:inherit;color:inherit;background:none;border:0;padding:0;outline:0}
button{cursor:pointer}
input{user-select:text;-webkit-user-select:text}
input::placeholder{color:#ffffff66}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* Quadratischer Screen, alle Maße in cqw (1cqw = 1 % Breite) — Werte aus SPEC.md */
#screen{position:relative;width:min(100vw,100dvh);aspect-ratio:1;container-type:size;overflow:hidden;border-radius:calc(min(100vw,100dvh)*.08);background:#000}
/* Face-Pager (STEUERUNG.md P1-1): Karten mit Spalt, Wischen/Auslauf in JS (Pager-Block unten), scrollLeft bleibt die API; Schritt = Breite + Spalt */
#faces{position:absolute;inset:0;display:flex;gap:2.5cqw;overflow:hidden;touch-action:pan-y;transition:transform var(--sd) var(--spring)}
#faces::-webkit-scrollbar{display:none}
.face{--ink:#1c1c1e;--ink2:#1c1c1e99;--pad:1.9cqw;--gap:1.65cqw;--t:calc((100cqw - 2*var(--pad) - 2*var(--gap))/3);--tint:hsl(var(--h,0) 100% 72%);
  flex:0 0 100cqw;height:100cqw;border-radius:8cqw;position:relative;overflow:hidden;
  background:var(--wp) 0 0/100% 100%;transition:scale var(--sd) var(--spring),border-radius .3s,opacity .3s}
.face.mono{--tint:#ebebf599}
.face.light{--tint:#3c3c4399;color:#1c1c1e}

/* ---------- Smart-Home-Raster ---------- */
.f-grid{display:grid;grid-template:repeat(3,var(--t))/repeat(3,var(--t));gap:var(--gap);padding:var(--pad)}
/* Glas = vorgerenderte Blur-Wallpaper an der Kachelposition, kein Live-backdrop-filter */
.tile{position:relative;isolation:isolate;border-radius:4.3cqw;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5.3cqw 1cqw 4.9cqw;text-align:center;
  background:linear-gradient(165deg,#fff3,#fff1 45%,#fff0 75%),
    var(--wpb) calc(-1*(var(--pad) + var(--c)*(var(--t) + var(--gap)))) calc(-1*(var(--pad) + var(--r)*(var(--t) + var(--gap))))/100cqw 100cqw;
  /* Glasrand (Pixelprofil Website dashboard): 2 px helle Kante rundum (oben/unten kräftiger), 1 px dunkle Außenlinie */
  box-shadow:inset 0 .25cqw .1cqw #ffffff59,inset 0 -.25cqw .1cqw #ffffff40,inset 0 0 0 .25cqw #ffffff2e,0 0 0 .13cqw #0000002e,0 .6cqw 2cqw #0003;
  transition:transform var(--sd) var(--spring),scale .25s,color .3s}
.tile:active{transform:scale(.96);transition:transform .12s ease-out}
/* An-Zustand (Vorlage y-MO 02750/03850, b-Tbq 00515 per Pixelprobe): weiße Fläche ≈ 85 %, Zahl/Titel/Icon dunkelblau (≈ hsl(Face-Ton 100 % 21 %)) statt Schwarz, Untertitel heller; --ink/--ink2 setzt applyBg */
.tile::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(#fffc,#ffffff99);opacity:0;transition:opacity .3s}
.tile.on{color:var(--ink)}.tile.on::before{opacity:1}.tile.on .sub{color:var(--ink2)}.tile.on .ico{color:var(--accent,var(--ink))}
[data-e^="cover."]{--accent:#ff9500}[data-e^="media_player."]{--accent:#ff2d55}   /* Schloss/Ventilator an: Icon dunkel wie Titel (Vorlage y-MO 02750), kein Akzent */
.tile.on[data-e^="fan."]{--fanplay:running}
.tile.na{opacity:.45}
.tile[data-arm] .sub{font-size:0}.tile[data-arm] .sub::after{content:"Nochmal tippen";font-size:3cqw}
/* Helle Variante (Website highlights/homeview, Pixelproben): flach ohne Schatten; Aus = hellgrau 232, An = Lavendel (198,194,227), Icon/Titel lila */
.light .tile{background:#e8e8e8;box-shadow:none;color:#454546}.light .tile::before{display:none}.light .tile .sub{color:#828284}
.light .tile.on{background:#c6c2e3;color:#6a6393}.light .tile.on .sub{color:#9590b7}.light .tile.on .ico,.light .tile .ico{color:inherit}
.f-grid.light .dial svg g{stroke:#6a6393}.f-grid.light .dial .n{color:#6a6393;font-size:3.1cqw;font-weight:500}
.ico{font-size:9.5cqw;transition:color .3s}
/* Beschriftung (Frontalbild Website highlights/dashboard, auf 784 px normiert, Inter statt SF): Schrift 3,0 % W, Zeilenabstand 34 px (1×1) bzw. 32 px (Thermostat) */
.ttl{font-weight:600;font-size:3cqw;line-height:1.45}
.sub{font-size:3cqw;line-height:1.45;color:var(--tint);transition:color .3s}
.tile[data-size="2x2"]{padding:9cqw 2cqw 6cqw}
.tile[data-size="2x2"] .ico{font-size:20cqw}
.tile[data-size="2x2"] :is(.ttl,.sub){font-size:4.4cqw}
.tile[data-size="2x1"]:not(.thermo){flex-direction:row;justify-content:flex-start;gap:4cqw;padding:0 5cqw;text-align:left}

.num{display:grid;justify-items:center;font-weight:500;line-height:1;letter-spacing:-.02em}
.num>span{grid-area:1/1}
.thermo{justify-content:flex-start;padding:0}
.wxtile{position:relative;background:linear-gradient(#3b86dc,#a3cdf3);color:#fff;box-shadow:inset 0 0 0 .3cqw #ffffff59;padding:0}
.wxtile .loc{position:absolute;left:5cqw;top:4cqw;font-size:3.1cqw;font-weight:600}
.wxtile .tmp{position:absolute;left:5cqw;top:10cqw;font-size:22cqw;font-weight:300}
.wxtile .wi{position:absolute;left:5cqw;bottom:5cqw;font-size:12cqw}
.wxtile[data-size="1x1"] .tmp{font-size:10cqw;top:8cqw}.wxtile[data-size="1x1"] .wi{font-size:6cqw}
.thermo .num{font-size:27cqw;margin-top:4.8cqw}   /* Ziffernmitte bei 43 % der Kachelhöhe (Frontalbild dashboard), Ziffernhöhe 19,8 % W */
.thermo[data-size="2x1"] .num{font-size:13cqw;margin-top:4cqw}
.thermo[data-size="1x1"] .num{font-size:10cqw;margin-top:5.5cqw}
/*: Titel/Untertitel im 2×2-Thermostat so groß wie bei 1×1, eine Zeile („Wohnzimmer • 20,5°“) */
.thermo[data-size="2x2"] :is(.ttl,.sub){font-size:3cqw;line-height:1.36}
.thermo .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thermo .foot>div{min-width:0}
.thermo[data-size="1x1"] .chev{display:none}
.thermo[data-size="1x1"] .foot{justify-content:center}
.foot{position:absolute;inset:auto 0 5.5cqw;display:flex;align-items:center;justify-content:space-between;padding:0 4.8cqw}
.thermo[data-size="2x2"] .foot{bottom:3.1cqw;padding:0 3.1cqw}
.chev{font-size:5cqw;padding:2cqw;position:relative}
.thermo[data-size="2x2"] .chev{font-size:8.1cqw;display:grid;translate:0 -.3cqw}   /* Chevron 41 × 24 px bei 784 px (Frontalbild dashboard), Mitten bei 11 % / 89 % der Kachelbreite */
.chev::before{content:"";position:absolute;left:50%;top:50%;width:13cqw;height:13cqw;translate:-50% -50%;border-radius:50%;background:#fff;opacity:0;transition:opacity .13s linear;pointer-events:none}
.chev:active::before{opacity:.22;transition:none}
.x:active{background:#fff6}
#climate .num,.thermo .num{font-variant-numeric:tabular-nums}
.num i{display:inline-block;font-style:normal}

.greet{grid-area:1/1/2/4;display:flex;justify-content:space-between;align-items:flex-start;padding:5cqw 3cqw;font-size:5cqw;font-weight:600;text-transform:uppercase;line-height:1.25}
.greet>div>div:first-child{opacity:.7;font-weight:500}
.greet .gw{font-size:8cqw;font-weight:500}
.greet{position:relative;gap:3cqw}.greet .gw{margin-left:auto}
.av,.avf{width:10cqw;height:10cqw;border-radius:50%;flex:none;display:grid;place-items:center;font-size:4.5cqw;font-weight:600;color:#fff;background:var(--c) center/cover;border:0;padding:0;touch-action:manipulation}
.avf{position:absolute;right:3cqw;top:5cqw;z-index:5;opacity:0;scale:.4;pointer-events:none;transition:translate var(--sd) var(--spring),opacity .25s,scale var(--sd) var(--spring);transition-delay:calc(var(--k)*40ms)}
.fan .avf{opacity:1;scale:1;pointer-events:auto;translate:var(--x) var(--y)}
.av:active,.avf:active{scale:.92}

/* ---------- Uhren ---------- */
.dial{position:relative;border-radius:50%;aspect-ratio:1}
.f-grid .dial{height:100%;justify-self:center;transition:scale .25s}
.dial>svg{position:absolute;inset:0;width:100%;height:100%}
.glass{background:radial-gradient(circle at 50% 20%,#fff3,#fff1 60%,#fff0);box-shadow:inset 0 0 0 .3cqw #fff4,inset 0 .5cqw .8cqw #fff3,0 .6cqw 2cqw #0002}
.light .glass{background:#fff;box-shadow:none}
.hand{position:absolute;left:50%;bottom:50%;transform:translateX(-50%);transform-origin:50% 100%;background:#fff;border-radius:99px}
.hh{height:27%;width:3.8%}.mm{height:39%;width:3.2%}.ss{height:46%;width:.8%;background:#fffc}
.pin{position:absolute;left:50%;top:50%;width:4%;height:4%;margin:-2%;border-radius:50%;background:#fff}
.n{position:absolute;transform:translate(-50%,-50%);font-size:3.6cqw;font-weight:500}
.light .hand,.light .pin{background:#1c1c1e}.light .dial svg g{stroke:#1c1c1e}
/* Analoguhr-Kachel (Vorlage Website highlights/dashboard, frontal, Maße in % Zifferblatt-Ø): Stunden-/Minutenzeiger = dünner Stiel + breites Blatt mit runder Spitze (Länge 51 % / 88 % des Radius),
   Sekundenzeiger hauchdünn mit kurzem Gegengewicht und Endplättchen, Ring statt Punkt, Glasrand 1 px. Das Element deckt die obere Zifferblatthälfte ab (Drehpunkt = Mitte), Pseudo-Elemente zeichnen */
.f-grid .dial .hand{width:100%;height:50%;background:none;border-radius:0;color:#fff}
.f-grid.light .dial .hand{color:#1c1c1e}
.f-grid .hand::before,.f-grid .hand::after{content:"";position:absolute;left:50%;translate:-50% 0;background:currentColor;border-radius:99px}
.f-grid .hh{--L:49%}.f-grid .mm{--L:12%}
.f-grid :is(.hh,.mm)::before{top:var(--L);bottom:12.4%;width:4.4%}
.f-grid :is(.hh,.mm)::after{top:var(--L);bottom:0;width:1.5%}
.f-grid .ss::before{top:2%;bottom:-15%;width:.8%;border-radius:0}
.f-grid .ss::after{top:8%;height:19%;width:3.4%;border-radius:.3cqw;background:#fff}
.f-grid.light .dial .ss{color:#6a6393}.f-grid.light .ss::after{display:none}
.f-grid .dial .pin{width:3.6%;height:3.6%;margin:-1.8%;background:radial-gradient(circle,#0006 0 22%,#ffffffd9 26%)}
.f-grid.light .dial .pin{background:radial-gradient(circle,#fff 0 22%,#1c1c1e 26%)}
.f-grid .dial.glass{box-shadow:inset 0 0 0 .13cqw #ffffff59,inset 0 .5cqw .8cqw #fff3,0 .6cqw 2cqw #0001}
.f-grid.light .dial.glass{box-shadow:none}

/* Digitale Glas-Uhr (Face bigclock). Vorlagen: „Digital grün“ y-MO 07850 (Stil stack), „Lavalampe“ y-MO 07350/07167 (Stil line), Tiefen-/Foto-Uhr y-MO 08150 + Website faces_endframe (Stil depth).
   Maße in % Face (je Bild auf den Bildschirmrand normiert): Ziffernhöhe 37,3 % (stack) bzw. 41 % (line), Ziffer ≈ 15 % breit, rechter Rand 8,3 %, Textrand links 9,4 % */
.f-bigclock{overflow:hidden}
.f-bigclock.stack:not(.mono):not(.light){background:hsl(var(--h,150) 78% 55%)}
.f-bigclock .bt,.f-bigclock .bs{position:absolute;left:9.4cqw;font-size:5.8cqw;font-weight:600;line-height:6.1cqw;display:flex;flex-direction:column}
.f-bigclock .bt{top:7.3cqw}
.f-bigclock .bt span{display:flex;align-items:center;gap:1.2cqw}
.f-bigclock .bs{bottom:8cqw;flex-direction:row;align-items:center;gap:1.4cqw}
.f-bigclock .wi{height:5.2cqw}.f-bigclock [data-wxsi]{display:block;height:5.2cqw;aspect-ratio:28/24;fill:currentColor;stroke:currentColor}
.gt{font:48.2px 'Roboto Flex',sans-serif;font-variation-settings:'wght' 500,'wdth' 52,'opsz' 144,'XOPQ' 112,'YOPQ' 70,'YTFI' 788;font-feature-settings:'tnum'}
.f-bigclock.stack:not(.light) .gslow .gt{fill:hsl(calc(var(--h,150) + 28) 66% 82% / .96)}   /* untere Zeile y-MO 07850: rgb(176,238,237) gegen oben (194,244,243) */
.f-bigclock.lava .gt{font-size:53px;fill:#ffffff52;font-variation-settings:'wght' 500,'wdth' 44,'opsz' 144,'XOPQ' 130,'YOPQ' 70,'YTFI' 788}
.f-bigclock.stack:not(.light) .gt{fill:hsl(calc(var(--h,150) + 28) 76% 88% / .96)}   /* Ziffernfläche y-MO 07850: #c8f5f4 auf #32e891, untere Zeile ≈ 8 % dunkler */
/* Lavalampe: Farben relativ zum Ton (Blau 228 → Kern hsl(228 96 49) wie y-MO 07350, Magenta-Hof +65, Lavendelrand +13); Blob driftet (Bewegung nur grob belegt, y-MO 07167) */
.f-bigclock.lava{background:linear-gradient(115deg,hsl(calc(var(--h,228) + 55) 70% 62%) 0 38%,hsl(calc(var(--h,228) + 34) 75% 70%) 72%,hsl(calc(var(--h,228) + 13) 85% 76%))}
.lv{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.lv i{position:absolute;left:38cqw;top:28cqw;width:58cqw;aspect-ratio:1;border-radius:50%;animation:lava 13s ease-in-out infinite alternate;
  background:radial-gradient(circle closest-side,hsl(var(--h,228) 96% 49%) 0 80%,hsl(calc(var(--h,228) - 12) 100% 55%) 90%,hsl(calc(var(--h,228) - 24) 100% 58%) 95%,#0000 100%)}
.lv i:first-child{left:27cqw;top:17cqw;width:80cqw;background:radial-gradient(circle closest-side,hsl(calc(var(--h,228) + 66) 75% 55%) 0 48%,hsl(calc(var(--h,228) + 66) 75% 55% / 0) 100%)}
@keyframes lava{to{transform:translate(-5cqw,3cqw) scale(1.1,.92) rotate(24deg)}}
@media (prefers-reduced-motion:reduce){.lv i{animation:none}}

/* Analog-Face. Vorlagen (frontal Website faces_enhanced „Analog grün“ und „Relief rosé“, Pixelmaße auf 350 px Face; Video y-MO 01167/07100/08250/07950, TGo 00370/00485):
   Zeiger = dünner Stiel (1 %) + rundes Blatt (3,4 %, ab 7,8 % Länge), Stunde 25,5 %, Minute 43,5 %; Sekunde 0,7 % dünn, Länge 45 %, Gegengewicht 7,4 %; Ring 4 % */
.f-analog.an-big{--g:hsl(calc(var(--h,150) - 9) 41% 40%);background:var(--g);--hand:#fff;--sec:#ffffffeb;--pinc:var(--g)}   /* Website-Grün #3E935C = Ton 141 (Swatch Grün 150) */
.f-analog.an-relief{background:linear-gradient(135deg,hsl(var(--h,5) 38% 82%),hsl(var(--h,5) 16% 66%));--hand:hsl(var(--h,5) 35% 29%);--sec:#fb72d0;--pinc:hsl(var(--h,5) 28% 74%)}
.f-analog.an-big.tq{--g:hsl(calc(var(--h) - 14) 74% 71%);--hand:hsl(calc(var(--h) - 12) 95% 92%)}   /* Türkis/Cyan: y-MO 07950 hellcyan hsl(191 74 71) mit grünen Ziffern hsl(162 68 45), Zeiger weiß-cyan (Swatch 205 → -14) */
.f-analog.an-relief.tq{background:linear-gradient(135deg,hsl(calc(var(--h) - 25) 52% 70%),hsl(calc(var(--h) - 25) 48% 62%));--hand:hsl(calc(var(--h) - 32) 47% 29%);--pinc:hsl(calc(var(--h) - 25) 48% 66%)}   /* y-MO 07100 Mint: hsl(180 52 68), Zeiger hsl(173 47 29) */
.f-analog.an-white{background:linear-gradient(135deg,#f4f4f4,#c9c9c9);--hand:#2a2a2c;--sec:#c8742f;--pinc:#d9d9d9}
.fnum{position:absolute;inset:0;width:100%;height:100%}
.an-big .fnum text{font:278 55.2px Inter,sans-serif;fill:#000}
.f-analog.an-big.tq{--sec:hsl(calc(var(--h) - 20) 40% 45%)}.an-big.tq .fdate{color:hsl(calc(var(--h) - 43) 40% 52%)}
.an-big.tq .fnum text{fill:hsl(calc(var(--h) - 43) 68% 45%)}
.an-relief .fnum text,.an-white .fnum text{font:560 16.4px Inter,sans-serif;fill:#000}
.fdate{position:absolute;left:6.4cqw;bottom:5.7cqw;font-size:5.4cqw;line-height:1;font-weight:700;color:#000;letter-spacing:.01em}
.f-analog .dial.fl{position:absolute;inset:0;width:auto;aspect-ratio:auto;border-radius:0;background:none}
.f-analog .dial.fl .hand{width:100%;height:50%;background:none;border-radius:0;color:var(--hand)}
.f-analog .dial.fl .hand::before,.f-analog .dial.fl .hand::after{content:"";position:absolute;left:50%;translate:-50% 0;background:currentColor;border-radius:99px}
.f-analog .dial.fl .hh{--L:26.8}.f-analog .dial.fl .mm{--L:44.4}
.f-analog .dial.fl :is(.hh,.mm){filter:drop-shadow(.2cqw .6cqw .9cqw #0004)}
.f-analog .dial.fl :is(.hh,.mm)::before{top:calc(50cqw - var(--L)*1cqw);bottom:7.8cqw;width:3.4cqw}
.f-analog .dial.fl :is(.hh,.mm)::after{top:calc(50cqw - var(--L)*1cqw + 2cqw);bottom:0;width:1cqw}
.f-analog .dial.fl .ss{color:var(--sec)}
.f-analog .dial.fl .ss::before{top:5cqw;bottom:-7.4cqw;width:.7cqw;border-radius:0}
.f-analog .dial.fl .ss::after{display:none}
.f-analog .dial.fl .pin{width:3.6cqw;height:3.6cqw;margin:-1.8cqw;background:radial-gradient(circle,var(--pinc) 0 38%,var(--sec) 44%);box-shadow:0 .3cqw .6cqw #0003}
.f-analog.an-relief .dial.fl .pin{width:3.8cqw;height:3.8cqw;margin:-1.9cqw;background:radial-gradient(circle closest-side,var(--pinc) 0 28%,var(--hand) 31% 46%,var(--sec) 49% 74%,var(--hand) 77% 99%,transparent)}   /* Website rosé: braune Scheibe, dünner Ring, graurosa Mitte */

/* Legacy-Stile (Zahlen/Striche/Minimal, gespeicherte Konfigurationen): keine Vorlage, unverändert */
.f-analog.lg{display:grid;place-items:center}
.f-analog.lg .dial{width:86cqw}
.f-analog.lg .n{font-size:8.5cqw;font-weight:600;opacity:.9}
.f-analog.lg .hh{width:2.6%}.f-analog.lg .mm{width:2%}.f-analog.lg .ss{background:#ff9f0a}


/* ---------- Kalender ---------- */
.f-calendar{padding:7cqw 6cqw;display:flex;flex-direction:column;gap:3cqw}
.f-calendar .big{position:absolute;inset:0;display:grid;place-items:center;font-size:85cqw;font-weight:700;letter-spacing:-.06em;color:#ff3b30;opacity:.13}
.f-calendar header{position:relative;display:flex;justify-content:space-between;font-size:5cqw;font-weight:600}
.f-calendar header b{color:#ff3b30}
.f-calendar .days{position:relative;flex:1;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;justify-items:center;font-size:4.8cqw;font-weight:500}
.f-calendar .days i{font-style:normal;font-weight:700;font-size:3.6cqw;opacity:.5}
.f-calendar .o{opacity:.3}
.f-calendar .t{color:#fff;background:#ff3b30;border-radius:50%;width:8.5cqw;height:8.5cqw;display:grid;place-items:center;font-weight:700}

/* ---------- Wetter: Face, Himmel-Animationen und Icons in weather.js ---------- */

/* ---------- Info ---------- */
/* Maße aus (hell) / hero_endframe (dunkel): Datum + Tag zentriert über der linken Spalte, keine Zifferblatt-Scheibe */
.f-info{--paper:#92abb1;display:grid;grid-template:1fr 1fr/1fr 1fr;padding:6cqw;gap:4cqw;align-items:end}
.f-info>div:first-child{text-align:center}
.f-info .date{font-size:8.5cqw;font-weight:600}.f-info .date b{color:#ff9f0a;font-weight:600}.f-info .date span{color:#8e8e93}
.f-info .day{font-size:33cqw;font-weight:600;line-height:.85;letter-spacing:-.04em}
.f-info .dial{width:100%;align-self:start}.f-info .ss{background:#ff9f0a}
.f-info .wx{position:relative}.f-info .mn{position:absolute;left:-9cqw;top:.3cqw;font-size:6cqw;color:#ff9f0a}
/* Hell = Graublau: schwarze Zeiger, weißer Sekundenzeiger, Wochentag, Ort und Note weiß */
.f-info.light .ss{background:#fff}.f-info.light .pin{background:#1c1c1e;box-shadow:0 0 0 .35cqw #fff}
.f-info.light :is(.date b,.wx .loc,.mn){color:#fff}.f-info.light .date span{color:#343c3f}.f-info.light .np>span{color:#455154}.f-info.light .np button{background:#00000026}.f-info.light .np button span{color:inherit}
.cover{background:#3a3a3c var(--art) center/cover}
.np .cover{width:22cqw;aspect-ratio:1;border-radius:2.4cqw}
.np b,.np span{display:block;font-size:3.3cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np b{margin-top:2cqw;text-transform:uppercase}.np span{color:#8e8e93}
.np button{display:inline-flex;align-items:center;gap:1.2cqw;margin-top:1.5cqw;font-size:3.8cqw;padding:1.3cqw 3.6cqw;border-radius:9cqw;background:#2c2c2e}
.wx .loc{color:#ff9f0a;font-size:4cqw;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx .tmp{font-size:19.5cqw;font-weight:500;line-height:1}
.wx div{font-size:3.6cqw}
.f-info .wx .wi{display:block;font-size:5cqw;margin:1cqw 0 .6cqw}

/* ---------- Musik (Maße aus Video t = 36 s) ---------- */
.f-music{background:#1c1c1e}
/* ponytail: CSS-Blur auf dem Cover-Layer; ruckelt das beim Wischen auf dem Tablet → vorgerendertes Blur-Bild */
.f-music .mbg{position:absolute;inset:-15%;background:var(--art) center/cover;filter:blur(60px) brightness(.6) saturate(1.3)}
.mb,.mpill{position:absolute;top:6cqw;height:8.6cqw;border-radius:9cqw;background:#ffffff1f;box-shadow:inset 0 .15cqw .1cqw #ffffff40,inset 0 0 0 .1cqw #ffffff1a;display:flex;align-items:center;justify-content:space-around;font-size:5cqw}
.mb{left:6cqw;width:8.6cqw;justify-content:center}
.mpill{right:6.3cqw;width:18cqw;padding:0 1.5cqw}
.f-music>.cover{position:absolute;left:18.75cqw;top:18.5cqw;width:62.5cqw;aspect-ratio:1;border-radius:2.8cqw;box-shadow:0 2cqw 6cqw #0005;transform-origin:0 0}
/* unteres Cover-Drittel weich verwischt unter dem Text (statischer Filter, wird einmal gerastert) */
.f-music>.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;filter:blur(1.6cqw) brightness(.85);-webkit-mask-image:linear-gradient(#0000 55%,#000 82%);mask-image:linear-gradient(#0000 55%,#000 82%);transform-origin:50% 45%;transition:transform var(--sd) var(--spring)}
.minfo{position:absolute;left:9cqw;right:16cqw;top:59cqw;text-shadow:0 .2cqw 1.5cqw #0004}
.minfo b,.minfo span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minfo b{font-size:6.1cqw;font-weight:600;line-height:1.2;text-transform:uppercase}   /* Titel in Versalien wie Vorlage carousel_1/entertainment_2 */
.minfo span{font-size:4cqw;line-height:1.25;color:#ffffffa6}
.more{position:absolute;right:9.6cqw;top:61.8cqw;width:5cqw;height:5cqw;border-radius:50%;background:#ffffffd9;color:#3a3a3c;display:grid;place-items:center;font-size:3.6cqw}
/* Trefferfläche 5,6 % hoch, sichtbarer Balken 1,1 % (beim Ziehen dicker) */
.f-music .prog{position:absolute;left:9cqw;right:9cqw;top:72.95cqw;height:5.6cqw;display:flex;align-items:center;touch-action:none;cursor:pointer}
.prog b{flex:1;height:1.1cqw;border-radius:1cqw;background:#ffffff40;overflow:hidden;transition:height .2s}
.prog.drag b{height:2.2cqw}
.prog i{display:block;height:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.f-music .times{position:absolute;left:9cqw;right:9cqw;top:78cqw;display:flex;justify-content:space-between;font-size:2.8cqw;color:#ffffff99;font-variant-numeric:tabular-nums}
.f-music .c{position:absolute;top:88cqw;translate:-50% -50%;display:grid;place-items:center;transition:scale var(--sd) var(--spring),opacity .45s,background-color .3s,color .3s}
.f-music .c:active{scale:.85;transition-duration:.1s}
.c.lyr{left:12cqw;font-size:6.6cqw;color:#ffffff99}
.c.prev{left:28.3cqw;font-size:11.9cqw}
/* Podcast (media_content_type podcast/episode; Vorlage highlights/sound_visuals): 15 s zurück / 30 s vor statt Titelwechsel, Titel läuft aus (Maske) statt …  */
.f-music .c svg.pod{display:none}.f-music.pod .c svg.pod{display:block}.f-music.pod .c svg.std{display:none}
.f-music.pod .minfo b{text-transform:none;text-overflow:clip;-webkit-mask:linear-gradient(90deg,#000 88%,#0000);mask:linear-gradient(90deg,#000 88%,#0000)}
.f-music.pod .c:is(.prev,.next){font-size:9.6cqw}
.c.play{left:50cqw;font-size:11cqw}
.c.next{left:71.5cqw;font-size:11.9cqw}
.c.queue{left:88cqw;font-size:6.6cqw;color:#ffffff99}
.c:is(.lyr,.queue){width:10.5cqw;height:10.5cqw;border-radius:50%}
.ly .c.lyr,.qm .c.queue{color:#fff;background:#ffffff38;--bf:#fff;--qf:#3a3a3c}
.f-music>:is(.cover,.mb,.mpill,.minfo,.more,.prog,.times,.lyrics,.qlist){transition:opacity .45s,transform var(--sd) var(--spring)}
/* Liedtext (Video 38 s): Cover/Titel/Fortschritt weg, Zeilen links, aktive weiß, Rest gedimmt + je Abstand stärker verwischt */
:is(.ly,.qm)>:is(.cover,.minfo,.more,.prog,.times){opacity:0;pointer-events:none}
:is(.ly,.qm)>.cover{transform:translate(1.9cqw,1.9cqw) scale(.94)}
:is(.ly,.qm)>.minfo{transform:translateY(-8cqw)}
.lyrics{position:absolute;inset:0 0 21cqw;overflow:hidden;opacity:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(#0000 6cqw,#000 24cqw,#000 60cqw,#0000);mask-image:linear-gradient(#0000 6cqw,#000 24cqw,#000 60cqw,#0000)}
.lyrics{transform:translateY(-6cqw);touch-action:none}
.ly .lyrics{opacity:1;pointer-events:auto;transform:none}
/* --o = von Hand gescrollt; nach 3 s federt es zurück zur aktiven Zeile */
.ll{padding:0 12cqw 0 9cqw;transform:translateY(var(--o,0px));transition:transform var(--sd) var(--spring)}
.ll.scrub{transition:none}
/* Zeilen unterhalb der aktiven folgen leicht verzögert → Welle wie bei  */
/* ponytail: filter-Übergang malt je Zeile auf dem Main-Thread; ruckelt das auf dem Tablet → nur opacity */
.ll p{font-size:6.6cqw;font-weight:700;line-height:1.2;margin-bottom:3.4cqw;opacity:.35;filter:blur(calc(var(--d,2)*.3cqw));transform:translateY(var(--y,0));
  transition:opacity .5s,filter .5s,transform var(--sd) var(--spring) calc(var(--w,0)*40ms);cursor:pointer}
.ll p.on,.ll.plain p{opacity:1}
.ll:is(.scrub,.plain) p{filter:none}
/* Instrumental: drei Punkte füllen sich über die Pause, die Gruppe atmet */
.ll .gap{display:flex;gap:1.8cqw;height:5cqw;align-items:center;transform-origin:0 50%}
.gap i{width:2.6cqw;height:2.6cqw;border-radius:50%;background:#fff;opacity:.35}
.gap.on{animation:breathe 2.4s ease-in-out infinite}
.gap.on i{animation:dotfill calc(var(--gd)/3) linear calc(var(--gd)/3*var(--n) - var(--ge,0s)) both}
.gap i:nth-child(2){--n:1}.gap i:nth-child(3){--n:2}.gap i:first-child{--n:0}
.ll.paused .gap,.ll.paused .gap i{animation-play-state:paused}
@keyframes dotfill{to{opacity:1}}
@keyframes breathe{50%{scale:1.12}}
/* Ruhe-Modus: nach IDLE ohne Berührung Cover randlos, Bedienelemente aus; erster Tipp weckt nur */
/* Video 36 s: am Ende steht nur noch das Cover, auch der Titel blendet aus */
.amb :is(.mb,.mpill,.more,.prog,.times,.c,.minfo){opacity:0;pointer-events:none}
.amb:not(.ly,.qm)>.cover{transform:translate(-18.75cqw,-18.5cqw) scale(1.6)}
.amb:not(.ly,.qm)>.minfo{transform:translateY(4cqw)}
/* randlos: Blur-Ebene etwas größer, sonst scheint am Bildrand das scharfe Cover durch */
.amb:not(.ly,.qm)>.cover::after{transform:scale(1.12)}

/* Warteschlange (wie Lyrics-Modus, Liste statt Text) */
.qlist{position:absolute;inset:17cqw 0 21cqw;overflow-y:auto;scrollbar-width:none;padding:0 6cqw 4cqw;opacity:0;pointer-events:none;transform:translateY(4cqw)}
.qlist::-webkit-scrollbar{display:none}
.qm .qlist{opacity:1;pointer-events:auto;transform:none}
.qhead{display:flex;align-items:center;gap:2cqw;padding:0 3cqw 2cqw;font-weight:700;font-size:5cqw}
.qhead span{flex:1}
.tg{position:relative;width:9.5cqw;height:7cqw;border-radius:2.4cqw;background:#ffffff1f;display:grid;place-items:center;font-size:4cqw;color:#ffffffb3;transition:background-color .2s,color .2s}
.tg.on{background:#fff;color:#1c1c1e}
.tg small{position:absolute;right:1.2cqw;bottom:.6cqw;font-size:2.2cqw;font-weight:800}
.qi{display:flex;align-items:center;gap:3cqw;width:100%;padding:1.6cqw 3cqw;border-radius:3cqw;text-align:left;transition:background-color .2s}
.qi:active{background:#ffffff1a}
.qi .cover{width:10cqw;aspect-ratio:1;border-radius:1.6cqw;flex:none}
.qi>div{min-width:0}
.qi b,.qi small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi b{font-size:3.8cqw;font-weight:600}.qi small{font-size:3.2cqw;color:#ffffff8c}
.qnone{padding:6cqw 3cqw;color:#ffffff8c;font-size:3.8cqw}
/* Popover: Ausgabe/Lautstärke und „…“-Menü; springt aus dem Button */
.pop{position:absolute;z-index:3;width:62cqw;padding:2cqw;border-radius:5cqw;background:#2c2c2ef7;box-shadow:0 2cqw 6cqw #0006;font-size:3.8cqw;
  opacity:0;scale:.4;pointer-events:none;touch-action:none;transition:opacity .2s,scale var(--sd) var(--spring)}
.pop.open{opacity:1;scale:1;pointer-events:auto}
.outs{top:16.5cqw;right:6.3cqw;transform-origin:top right}
.menu{bottom:40cqw;right:9.6cqw;width:56cqw;transform-origin:bottom right}
.pop h4{font-size:3.2cqw;font-weight:600;color:#ffffff8c;padding:1.4cqw 2.4cqw 1cqw}
.orow{padding:1.4cqw 2.4cqw}
.orow>button{display:flex;align-items:center;gap:2.4cqw;width:100%;font-weight:600;text-align:left;margin-bottom:1.6cqw}
.orow>button>span{flex:1;min-width:0}
.orow small{display:block;font-weight:400;font-size:3cqw;color:#ffffff8c}
.ck{width:5.4cqw;height:5.4cqw;border-radius:50%;border:.4cqw solid #ffffff59;display:grid;place-items:center;font-size:3.2cqw;font-style:normal}
.ck.on{background:#0a84ff;border-color:#0a84ff}
[data-act=grp]{position:relative}[data-act=grp]::after{content:'';position:absolute;inset:-2.4cqw}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:7cqw;margin:0;border-radius:2.2cqw;cursor:pointer;
  background:linear-gradient(#fff,#fff) 0/var(--v,50%) 100% no-repeat,#ffffff2e}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1px;height:7cqw;background:transparent}
input[type=range]::-moz-range-thumb{width:1px;height:7cqw;border:0;background:transparent}
.mi{display:flex;align-items:center;gap:3cqw;width:100%;padding:2.4cqw;border-radius:2.4cqw;text-align:left;transition:background-color .2s}
.mi:active{background:#ffffff1a}
.mi span{flex:1}.mi small{color:#ffffff8c;font-size:3.4cqw}
.mi+.mi{border-top:.15cqw solid #ffffff14}

/* ---------- Uhr-Stile ---------- */
.dclock{border-radius:50%;aspect-ratio:1;display:grid;place-items:center;font-weight:600;font-size:7.6cqw;letter-spacing:-.02em}
.f-grid .dclock{height:100%;justify-self:center}
.dclock[data-size="2x2"]{font-size:16cqw}
.dial.minimal>svg{display:none}
.dial.minimal :is(.hh,.mm){width:5%}
.dial.minimal :is(.ss,.pin){background:#ff9f0a}
.dsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dsvg{animation:drv .8s cubic-bezier(.34,1.5,.64,1) both}
@keyframes drv{from{opacity:0;transform:translateY(10%);filter:blur(10px)}}
.dt{font:74px 'Roboto Flex',sans-serif;font-variation-settings:'wght' 420,'wdth' 25,'opsz' 144,'XOPQ' 88,'YOPQ' 72;font-feature-settings:'pnum';text-anchor:middle}
.dg{fill:#fff6}
.dsvg feFlood{flood-color:#fff}.dsvg .rk{flood-color:#000}
.f-bigclock.lava .dsvg>g{transition:transform .3s cubic-bezier(.3,1.3,.5,1)}.f-bigclock.lava .dsvg.h1>g{transform:translateX(-6px)}
.f-bigclock.lava .rk{flood-color:#fff;flood-opacity:.3}.f-bigclock.lava .gk{flood-opacity:.85}   /* Lavalampe y-MO 07350: heller Rim + Innenglanz */
.f-bigclock.light .dg{fill:#0000000f}
.f-bigclock.light .dsvg feFlood{flood-color:#000}
.dfg{position:absolute;inset:0;background:0 0/100% 100%;pointer-events:none}

/* Tag ↔ Nacht langsam überblenden (phase() in JS) */
::view-transition-old(root),::view-transition-new(root){animation-duration:1.4s}

/* ---------- Vollbild-Ansichten ---------- */
.view{position:absolute;inset:0;z-index:2;transform-origin:0 0;overflow:hidden}
/* Öffnen aus der Kachel (hkrYiZ_g9tw 111,5–111,9 s): Raster dimmt + blurt (#dim), Karte startet weiß-opak (.wv, wird in fly() angelegt), Chrome folgt später */
#dim{position:absolute;inset:0;z-index:1;background:#0006;-webkit-backdrop-filter:blur(2cqw);backdrop-filter:blur(2cqw);opacity:0;pointer-events:none}
.wv{position:absolute;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none}
#cam{border-radius:8cqw}   /* Karte steigt von unten mit Display-Radius (v3wcg4Vi4u0 252,4–252,6 s); in Ruhe deckt der Screen-Radius ihn */
.x{position:absolute;z-index:1;left:4cqw;top:4cqw;width:8.5cqw;height:8.5cqw;border-radius:50%;background:#fff3;display:grid;place-items:center;font-size:4cqw}
.top{position:absolute;z-index:1;top:5.6cqw;inset-inline:0;text-align:center;font-weight:600;font-size:3.4cqw;pointer-events:none}
.top time{position:absolute;right:5cqw}
/* Klima + Licht Vollbild: Maße als % W aus dem Frontalbild des Apple-Videos (ref/t43.4.jpg, 2560-px-Frame 43,4 s, Display 328 px) und ref/vorlagen/_Tbq…/01260 (Beschriftung),
   y-MO ab 153 s (Modus-Menü, nur Handkamera); Schrift Inter statt SF (Breite abgeglichen), Zahl Medium */
#climate,#dimmer{--ty:-86.35%}   /* Inter bei line-height 1: Grundlinie bei 86,35 % der Zeilenhöhe → `top` = Grundlinie, Maße direkt aus dem Frame */
#climate .x,#dimmer .x{left:6cqw;top:5.8cqw;width:8.75cqw;height:8.75cqw;font-size:6.8cqw}   /* ⌀ 8,75, Mitte 10,4 / 10,2 */
#climate .x{background:var(--cb)}
#climate .x{transition:background-color .13s linear}
#climate .x:active{background:#fff4;transition:none}
#climate .top,#dimmer .top{top:10.6cqw;translate:0 -50%;line-height:1;font-size:3.8cqw;font-weight:400}   /* Titel mittig, Mitte y 10,3; Breite „Bedroom Air“ 22,3 % */
#climate .top time,#dimmer .top time{right:8.6cqw}   /* Uhrzeit endet bei 91,4 %, gleiche Farbe wie der Titel */
#climate{--cb:#fff3;--cm:color-mix(in srgb,var(--cc) 55%,#fff);--ct:#1c1c1e;background:var(--cc);transition:background-color .4s}
#climate.cool{--cb:#08bdfc;--cm:#00c9fa;--ct:#003a73}   /* ✕ #0bc1fc, Knopf #05b9fc, Menü ≈ #00c9fa (Frame/Handkamera), Menütext #003a73 */
#climate .mode{position:absolute;left:0;right:0;top:33.9cqw;translate:0 var(--ty);text-align:center;font-size:4.8cqw;font-weight:400;line-height:1}   /* „Cooling to“: Mitte 50,4, Grundlinie 33,9, Text ohne Pille */
#climate .num{position:absolute;left:0;right:0;top:60.7cqw;translate:0 var(--ty);font-size:29cqw;font-weight:500;justify-items:center;height:1em;pointer-events:none}   /* „74“: Ziffernhöhe 21 %, Grundlinie 60,7; pointer-events:none, sonst deckt die volle Breite die Chevrons ab (Touch erreichte sie nicht) */
#climate .num span.dec{font-size:24cqw}   /* Dezimalstellen (0,5-Schritte) hat die Vorlage nicht (°F ganzzahlig): kleiner, damit die Chevrons frei bleiben */
#climate .chev{position:absolute;top:50.6cqw;translate:-50% -50%;font-size:9.2cqw;display:grid;place-items:center}   /* Chevron 6,1 × 3,4, Mitten x 15,2 / 85,1, y 50,6 */
#climate .chev[data-act=down]{left:15.2cqw}
#climate .chev[data-act=up]{left:85.1cqw}
#climate .meta{position:absolute;left:0;right:0;top:65.8cqw;display:flex;justify-content:center;align-items:center;font-size:4.55cqw;font-weight:500;line-height:1}   /* Ist-Temp + Feuchte: Ziffernhöhe 3,3, Grundlinie 69,7, gesamt 29,7 breit */
#climate .meta .i{font-size:4.9cqw;margin-right:.3cqw}
#climate .meta span+.i{margin-left:1.6cqw}
#climate .meta .i:first-child{margin-right:-.7cqw}
#climate .meta span:last-child{margin-left:0}
.pw{position:absolute;right:4.3cqw;bottom:4.3cqw;width:14.7cqw;height:14.7cqw;border-radius:50%;background:var(--cb);display:grid;place-items:center;font-size:8cqw;transition:opacity .12s linear}   /* Thermometer + drei Punkte, ⌀ 14,7, Mitte 88,3 / 88,1 */
#climate.mo .pw{opacity:0;pointer-events:none}
/* Modus-Menü (y-MO 153–156 s): wächst aus dem Knopf, 45,3 × 42,5 (4 Zeilen à 10,1), Rand rechts 6, unten 5,8; „Off/Cool/Heat/Auto“, Haken vor der aktiven Zeile, Tipp daneben schließt */
.hm{position:absolute;z-index:2;right:6cqw;bottom:5.8cqw;width:45.3cqw;padding:1cqw 0;border-radius:5.5cqw;background:var(--cm);color:var(--ct);backdrop-filter:blur(2.5cqw);font-size:3cqw;
  transform-origin:87% 86%;opacity:0;scale:.33;pointer-events:none;transition:opacity .12s linear,scale .16s ease-in}
.hm.open{opacity:1;scale:1;pointer-events:auto;transition:opacity .12s linear,scale var(--sd) var(--spring)}
.hm button{position:relative;display:block;width:100%;height:10.1cqw;padding-left:9.2cqw;text-align:left;opacity:0;transition:opacity .1s linear}
.hm.open button{opacity:1;transition:opacity .15s linear .07s}
.hm .i{position:absolute;left:5.4cqw;top:50%;translate:0 -50%;font-size:3cqw;opacity:0}
.hm .on .i{opacity:1}
#dimmer{background:#fefaec;color:#111;touch-action:none}   /* Creme #fefaec, Füllung #f9c100, Zahl fast schwarz */
#dimmer .fill{position:absolute;inset:0;overflow:hidden;background:#f9c100;transform:translateY(calc((1 - var(--f,0)) * 100%))}   /* Füllung nur per transform; --f = Füllhöhe (setLight) */
#dimmer .fill .in{position:absolute;inset:0;transform:translateY(calc((1 - var(--f,0)) * -100%))}   /* Innen-Layer steht still: helle Zahl/Glühbirne werden an der Füllkante geteilt (Vorlage y-MO 0,5 s, zT8 42,0 s) */
#dimmer .fill .ico,#dimmer .fill .pct{color:#fefaec}
#dimmer .fill small{color:#fefaecb0}
#dimmer .x{background:#0000000f}
#dimmer .top{color:#1c1c1e}
#dimmer .ico{position:absolute;left:50%;top:19.9cqw;translate:-50% 0;width:7.75cqw;height:12.9cqw;font-size:inherit;fill:currentColor;stroke:none}   /* Glühbirne 7,75 × 12,9, oben 19,9 */
#dimmer .pct{position:absolute;left:50%;top:60.2cqw;translate:-50% var(--ty);font-size:29cqw;font-weight:500;line-height:1;letter-spacing:-.02em;white-space:nowrap}   /* „33“: Ziffernhöhe ≈ 21,3, Grundlinie 60,2, Zahl fest mittig */
#dimmer small{display:inline-block;width:0;margin-left:.9cqw;font-size:14cqw;font-weight:400;letter-spacing:0;color:#0000006e}   /* „%“ 10,3 hoch, hängt rechts neben der Zahl (nicht mitzentriert), Schwarz 43 % */
/* Griff: kurzer Strich 8,8 × 1,2 an der Füllkante (Frame 43,4 s: Kante 60,8, Griff 62,3–63,5; Füllhöhe gegen Wert siehe STEUERUNG F7, unverändert) */
#dimmer .grip{position:absolute;left:50%;top:0;width:8.8cqw;height:1.2cqw;margin-left:-4.4cqw;border-radius:.6cqw;background:#000000a0;transform:translateY(calc((1 - var(--f,0)) * 100cqw + 1.9cqw))}
/* Musikauswahl (Video 36 s: hell, Titel mittig, Zurück rund, 3 Spalten) */
#lib{background:#f2f2f7;color:#1c1c1e}
#lib .x{background:#0000000f}
#lib .top{font-size:3.8cqw}
.lgrid{position:absolute;inset:15cqw 0 0;overflow-y:auto;scrollbar-width:none;padding:1cqw 5cqw 6cqw;display:grid;grid-template-columns:repeat(3,1fr);gap:4cqw 3cqw;align-content:start}
.lgrid::-webkit-scrollbar{display:none}
.li{text-align:left;min-width:0;transition:scale var(--sd) var(--spring)}
.li:active{scale:.95;transition-duration:.1s}
.li .cover{display:grid;place-items:center;aspect-ratio:1;border-radius:2.6cqw;box-shadow:0 .6cqw 2cqw #0002;color:#fff;font-size:9cqw}
.li b,.li small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li b{font-size:3.3cqw;font-weight:600;margin-top:1.6cqw}
.li small{font-size:3cqw;color:#8e8e93}
.lnone{grid-column:1/-1;text-align:center;color:#8e8e93;padding-top:20cqw;font-size:3.8cqw}

/* ---------- Assist/Siri (Video 15,3–18 s) ----------
   Tropfen: schwarzer Kreis + Kamerarand im Goo-Filter (Blur + Alpha-Schwelle) → Metaball-Hals, reißt ab (~0,2 s);
   dann übernimmt die Glaskugel (20 % W, Mitte 50 %/17 %). Antwort: weiße Karte, Kugel klein oben (9,5 % W, y 9 %). */
#assist{position:absolute;inset:0;z-index:20;pointer-events:none}
#assist:is(.listen,.think,.answer){pointer-events:auto}
#assist .goo{position:absolute;left:35cqw;top:-16cqw;width:30cqw;height:46cqw;overflow:visible;visibility:hidden}
#assist.drop .goo{visibility:visible}
#assist circle{transform-box:fill-box;transform-origin:center}
#assist .abg{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .3s}
#assist.answer .abg{opacity:1}
/* Lichtschein der Kugel auf dem Inhalt darunter */
#assist .bloom{position:absolute;left:29cqw;top:13cqw;width:42cqw;height:34cqw;border-radius:50%;background:radial-gradient(closest-side,#fff,#fff9 30%,#fff3 55%,#fff0);
  mix-blend-mode:plus-lighter;opacity:0;transition:opacity .4s}
#assist.listen .bloom{opacity:.6;animation:bloom 1.7s ease-in-out infinite alternate}
#assist.think .bloom{opacity:.95;animation:bloom .5s ease-in-out infinite alternate}
@keyframes bloom{from{scale:.88}to{scale:1.12}}
#assist .orb{position:absolute;left:40cqw;top:7cqw;width:20cqw;height:20cqw;border-radius:50%;overflow:hidden;opacity:0;
  background:radial-gradient(34% 11% at 50% 10%,#000 70%,#0000),linear-gradient(#141418e6 0 22%,#000c 44%,#0005 58%,#0000 68%);
  -webkit-backdrop-filter:brightness(1.7) saturate(1.2) blur(.3cqw);backdrop-filter:brightness(1.7) saturate(1.2) blur(.3cqw);
  box-shadow:inset 0 0 0 .12cqw #ffffff2e,inset 0 -1.6cqw 2.4cqw #fff5,0 0 0 .1cqw #0002,0 1.5cqw 4cqw #0004}
#assist:is(.listen,.think,.answer,.out) .orb{opacity:1}
/* weißer Lichtbogen im unteren Drittel, schwingt; Regenbogensaum dreht langsam */
#assist .hl{position:absolute;left:12%;right:12%;top:30%;height:34%;border-radius:50%;border-bottom:1.7cqw solid #fff;filter:blur(.45cqw) drop-shadow(0 0 .8cqw #fff);
  animation:hl 2.2s ease-in-out infinite alternate}
#assist.think .hl{animation-duration:.6s}
@keyframes hl{0%{transform:rotate(-7deg) scaleX(.9)}50%{transform:translateY(-4%) rotate(3deg) scaleX(1.06)}100%{transform:translateY(3%) rotate(8deg) scaleX(.94)}}
#assist .iri{position:absolute;inset:0;border-radius:50%;opacity:.3;mix-blend-mode:screen;animation:spin 5s linear infinite;
  background:conic-gradient(from 100deg,#0000,#ff3cac 8%,#7a5cff 16%,#2bb5ff 24%,#3dffc5 32%,#fff35c 40%,#0000 48%);
  -webkit-mask:radial-gradient(closest-side,#0000 74%,#000 90%,#0000);mask:radial-gradient(closest-side,#0000 74%,#000 90%,#0000)}
#assist.answer .iri{opacity:0;transition:opacity .3s}
@keyframes spin{to{rotate:360deg}}
#assist .ink{position:absolute;inset:0;background:#000;opacity:0}
/* Transkript (Vorlage frames/highlights-siri_1…5): weiß, Semibold, mittig über der Kugel; Textbreite ≈ 1,8 × Kugel → 3,6 cqw, Zeilenabstand 1,22.
   Wörter kommen kleiner, tiefer und unscharf herein und federn auf die Grundlinie; die Kugel wird darunter zur flachen Welle */
#assist .atr{position:absolute;left:10cqw;right:10cqw;top:17cqw;translate:0 -50%;text-align:center;color:#fff;font-weight:600;font-size:3.6cqw;line-height:1.22;letter-spacing:-.01em;text-shadow:0 0 2.5cqw #0009;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .25s}
#assist.think .atr{opacity:1}
#assist .atr span{display:inline-block;opacity:0;transform:translateY(.4em) scale(.85);filter:blur(.5cqw);animation:atw var(--sd) var(--spring) forwards}
@keyframes atw{to{opacity:1;transform:none;filter:none}}
#assist .orb,#assist .bloom{transition:filter .4s,opacity .4s}
/* Welle = gestauchte Kugel ohne dunklen Kern: weißes Lichtband mit Regenbogensaum */
#assist.wave .orb{filter:blur(.3cqw);background:none;box-shadow:0 0 4cqw #fff9,inset 0 0 0 .15cqw #fff8}
#assist.wave .iri{opacity:.5;-webkit-mask:none;mask:none}
/* Mikrofon-Punkt oben rechts (Video: 94 %/6,4 %) */
#assist .mic{position:absolute;right:5.4cqw;top:5.8cqw;width:1.3cqw;height:1.3cqw;border-radius:50%;background:#ff9f0a;opacity:0;transition:opacity .3s}
#assist:is(.listen,.think) .mic{opacity:1}
/* Antwortkarte (Video 18 s): Text 5,6 % Regular, Karte mit Rand + Innenbild + Glas-Infofeld, blaue Pille */
#assist .ans{position:absolute;inset:0;color:#1c1c1e;pointer-events:none}
#assist.answer .ans{pointer-events:auto}
#assist .ans>*{position:absolute;opacity:0;transform:translateY(3cqw);transition:opacity .35s,transform var(--sd) var(--spring)}
#assist.answer .ans>*{opacity:1;transform:none}
#assist.answer .ans>:nth-child(2){transition-delay:.07s}
#assist.answer .ans>:nth-child(3){transition-delay:.14s}
#assist[data-k=voice] :is(.acard,.apill,.acal){display:none}
/* Antwort (Vorlage siri-ai/gallery_*): 5,9 %, Zeilenhöhe 1,18, Kernfakten fett; lange Texte scrollen statt in die Karte zu laufen */
#assist .atxt{left:8.6cqw;right:8cqw;top:13.2cqw;max-height:24cqw;overflow-y:auto;scrollbar-width:none;font-size:5.9cqw;line-height:1.18}
#assist .atxt::-webkit-scrollbar{display:none}
#assist .atxt b{font-weight:700}
#assist[data-k=voice] .atxt{max-height:76cqw}
#assist .acard{left:4.5cqw;right:4.5cqw;top:40cqw;bottom:-6cqw;padding:2.6cqw;border:.25cqw solid #e5e5ea;border-radius:5.8cqw;background:#fff}
#assist .asky{position:relative;height:44cqw;border-radius:4.2cqw;overflow:hidden;background:linear-gradient(#3b86dc,#a3cdf3);color:#fff}
#assist .asky .t{position:absolute;left:5cqw;top:2cqw;font-size:13cqw;font-weight:300}
#assist .asky .wi{position:absolute;right:5cqw;top:5cqw;font-size:9cqw}
#assist .ainfo{position:absolute;left:1.6cqw;right:1.6cqw;bottom:1.6cqw;padding:2.6cqw 3.6cqw;border-radius:3.3cqw;background:#ffffffeb;color:#1c1c1e;font-size:3.2cqw;line-height:1.35}
#assist .ainfo b{display:block;font-size:3.9cqw;font-weight:700}
#assist .ainfo span{display:block;color:#8e8e93}
#assist .ainfo em{display:block;font-style:normal;color:#ff9500}
#assist .apill{left:7.2cqw;right:7.2cqw;top:89.5cqw;height:9cqw;border-radius:9cqw;background:#0a7cff;color:#fff;font-size:4.2cqw;font-weight:600;display:flex;align-items:center;justify-content:center;gap:2cqw}
#assist.answer .apill:active{scale:.96}
/* Kalender-Antwort: Liste statt Wetterkarte, läuft unten aus dem Screen; Pillen in events.js */
#assist .acal{left:4.4cqw;right:4.4cqw;top:35cqw;bottom:0;overflow:hidden}
#assist:not([data-k=cal]) .acal,#assist[data-k=cal] :is(.acard,.apill){display:none}
/* Auslöser: Kamera oben Mitte antippen oder herunterziehen */
#pull{position:absolute;left:30cqw;right:30cqw;top:0;height:3cqw;z-index:19;touch-action:none}
.lk .sh{fill:none;stroke:currentColor;stroke-linecap:round;transform-origin:7.8px 11.5px;transition:transform .55s cubic-bezier(.34,1.7,.5,1)}.lk.open .sh{transform:translateY(-2.4px) rotate(-32deg)}
</style>

      if (i === ':') { const H = style === 'stack' ? 37.3 : 41, c = y - H / 2; return `<g${lo}>${[-1, 1].map(k => `<circle class="gt dg" cx="${x}" cy="${c + k * .265 * H}" r="${.073 * H}"/>`).join('')}</g>`; }

    addEventListener('error', e => report('error', `${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})`));
    addEventListener('unhandledrejection', e => report('error', e.reason?.message ?? e.reason));
    for (const [k, level] of [['warn', 'warning'], ['error', 'error']]) {
      const o = console[k].bind(console);
      console[k] = (...a) => { o(...a); report(level, a.map(x => x?.message ?? x).join(' ')); };
    }
    let faceBack;
    // Befehle und geänderte Einstellungen aus HA (Entities des Displays)
    hello.then(() => conn.subscribeMessage(c => {
      if (c.kiosk) { const w = [CFG.weather, CFG.place]; CONF.kiosk = c.kiosk; applyK(c.kiosk); if ([CFG.weather, CFG.place] + '' !== w + '') return location.reload(); wk(); }
      else if (c.config?.faces?.length) { const i = curIdx(); CONF = { ...c.config, kiosk: CONF.kiosk }; normFaces(CONF, DEF.faces); try { localStorage.setItem(KEY, JSON.stringify(CONF)); } catch {} renderAll(Math.min(i, CONF.faces.length - 1)); }
      else if (c.timers) { if (voiceTimers(c.timers, c.finished)) kiosk.wake(); }   // Sprach-Timer: Display weckt bei Start und Ablauf
      else if (c.cameras !== undefined) { if (setCams(c.cameras)) cur ? camStale = true : renderAll(curIdx()); }   // offene Ansicht behält ihre Daten, die Faces ziehen nach dem Schließen nach
      else if (c.action === 'face' && c.face) {
        const prev = faces.children[curIdx()]?.className.match(/f-(\w+)/)?.[1];   // Face mit Dauer: danach zurück zum vorherigen
        clearTimeout(faceBack); kiosk.show(c.face);
        if (c.duration && prev && prev !== c.face) faceBack = setTimeout(() => kiosk.show(prev), c.duration * 1000);
      }
      else if (c.action === 'reload') hardReload();
      else if (c.action === 'screensaver') kiosk.sleep();
      else if (c.action === 'wake') kiosk.wake();
      else if (c.action === 'screenshot') shot().then(image => conn.sendMessagePromise({ type: 'homeblick/shot', display: DISPLAY, image })).catch(console.warn);
      else if (c.action === 'assist') { kiosk.wake(); assistStart(); }
      else if (c.action === 'stop') { try { speechSynthesis.cancel(); } catch {} assistEnd(); }
      else if (c.action === 'navigate' && c.path) { const u = new URL(c.path, location.href); if (u.origin === location.origin) location.assign(u); }   // nur Pfade derselben Herkunft (Browser streicht Tab/Umbruch: "/\t/x" wäre sonst //x)
      else if (c.action === 'announce' && c.message) { kiosk.wake(); announce(c.message, c.title); }
      else if (c.action === 'camera' && c.camera) { kiosk.wake(); camOpen(c.camera, c.duration); }
      else if (c.action === 'camera_close' && cur?.view.id === 'cam' && !camRinging()) close();   // Klingel nicht wegschließen
    }, { type: 'homeblick/subscribe', display: DISPLAY })).then(() => { wk(); kiosk.report(); conn.addEventListener('ready', () => kiosk.report()); setInterval(() => kiosk.report(), 30000); }).catch(console.warn);
    // Wake Word nur auf Wunsch (CONF.kiosk.wake): Mikrofon bleibt dann dauerhaft offen
    let wkCtl, wkModel;
    const wk = async () => {
      const m = { ...KIOSK_DEF, ...CONF.kiosk }.wake;
      if (m === wkModel) return;
      wkModel = m; wkCtl?.stop(); wkCtl = null; INFO.wake = null;
      if (m && voiceOK()) wkCtl = await wakeInit({ model: m, onWake: () => {
        kiosk.wake();
        // Barge-in: Wake Word während der Antwort bricht sie ab und hört neu zu
        if (CFG.barge && AS.className === 'answer' && voice) { voice.stop(); relisten(); assistVoice(); return; }
        assistStart();
        return new Promise(r => { const t = setInterval(() => (!AS.className || (CFG.barge && AS.className === 'answer')) && (clearInterval(t), r()), 300); });
      } }).catch(e => console.warn('Wake Word', e));
      INFO.wake = wkCtl ? m : null; kiosk.report();
    };
    hello.then(() => conn.subscribeMessage(f => { forecast = f.forecast?.[0]; schedule(); }, { type: 'weather/subscribe_forecast', forecast_type: 'daily', entity_id: CFG.weather })).catch(console.warn);
    hello.then(() => conn.subscribeMessage(f => weatherHours(f.forecast), { type: 'weather/subscribe_forecast', forecast_type: 'hourly', entity_id: CFG.weather })).catch(console.warn);   // Stundenleiste (Stil „Bedingungen“); Wetter ohne hourly → Fehler, Leiste bleibt leer
  } catch (err) {
    // In KS heißt ERR_INVALID_AUTH: Teilen aus / keine Custom Page. Kein Reload, sonst Endlosschleife.
    if (KS) console.error('KS: „Share Home Assistant connection“ einschalten bzw. Seite als Custom Page eintragen', err);
    else if (err === ha.ERR_INVALID_AUTH) { localStorage.removeItem('hassTokens'); location.reload(); }
    else console.error('HA', err);
  }
}
</script>
