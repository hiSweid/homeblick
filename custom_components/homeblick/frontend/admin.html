<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Homeblick Einstellungen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Optik: iOS-Einstellungen (inset grouped, Large Title, Push-Navigation, Sheet/Alert), Federn und Press wie im Display.
   Maße nach iOS-Konventionen; HomeView liefert dafür keine Vorlage (nur Display-Screens). */
:root{--bg:#f2f2f7;--grp:#ffffffc7;--fg:#000;--sec:#3c3c4399;--sep:#3c3c432e;--blue:#007aff;--green:#34c759;--red:#ff3b30;--fill:#78788029;--glass:#f2f2f7b8;
  --wall:radial-gradient(60vmax 45vmax at 8% -8%,#b9dcff99,#0000),radial-gradient(50vmax 40vmax at 100% 6%,#ffd3e699,#0000),radial-gradient(60vmax 50vmax at 60% 110%,#d6f5dd99,#0000),#f2f2f7}
@media(prefers-color-scheme:dark){:root{--bg:#000;--grp:#1c1c1ec7;--fg:#fff;--sec:#ebebf599;--sep:#54545899;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--fill:#7878805c;--glass:#000000b8;
  --wall:radial-gradient(60vmax 45vmax at 8% -8%,#1c3a5c99,#0000),radial-gradient(50vmax 40vmax at 100% 6%,#4a233a99,#0000),radial-gradient(60vmax 50vmax at 60% 110%,#1d3d2699,#0000),#000}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--wall) fixed;color:var(--fg);font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit;border:0;background:none;padding:0;outline:0;margin:0}
button{cursor:pointer;text-align:inherit}
svg{display:block}

/* Layout: schmal = Liste → Detail (Push), breit = Seitenleiste + Detail */
#app{position:fixed;inset:0;display:grid;grid-template-columns:100%}
#side{overflow-y:auto;padding:max(env(safe-area-inset-top),20px) 16px 40px}
#pane{position:fixed;inset:0;background:var(--wall) fixed;transform:translateX(100%);transition:transform var(--sd) var(--spring);overflow:hidden}
#app[data-open="1"] #pane{transform:none}
@media(min-width:820px){
  #app{grid-template-columns:340px 1fr}
  #side{border-right:.5px solid var(--sep)}
  #pane{position:relative;transform:none;transition:none}
}
.lt{font:700 34px/1.15 -apple-system,Inter,system-ui,sans-serif;letter-spacing:.2px;margin:18px 4px 2px}
.lsub{color:var(--sec);margin:0 4px 18px}

/* Vorschau + Inspektor: nur auf breiten Fenstern, eigene Spalte */
#pv{display:none;flex-direction:column;gap:10px;align-items:stretch;padding:max(env(safe-area-inset-top),16px) 18px 18px;overflow:hidden;min-height:0}
#app[data-ed="1"] #pv{display:flex;position:fixed;inset:0;z-index:15;background:var(--wall)}
@media(min-width:1180px){
  #app{grid-template-columns:340px 1fr 480px}
  #pv,#app[data-ed="1"] #pv{display:flex;position:static;border-left:.5px solid var(--sep);background:none}
  .edbtn,.pvx{display:none}
}
.pvh{display:flex;align-items:center;justify-content:space-between;gap:10px}.pvh b{font-size:17px;font-weight:600}.pvx{color:var(--blue);font-weight:600}
#pvf{flex:none;width:min(100%,max(300px,calc(100dvh - 470px)));aspect-ratio:1;align-self:center;border:0;border-radius:28px;background:#000;box-shadow:0 8px 30px #0003}
#pvfaces{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
#pvfaces button.plus2{color:var(--blue)}
#pvfaces button{flex:none;padding:6px 12px;border-radius:16px;background:var(--fill);font-size:14px;white-space:nowrap}#pvfaces .on{background:var(--blue);color:#fff}
#insw{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;border:.5px solid var(--sep)}
.rot-l{transform:rotate(-90deg)}.rot-r{transform:rotate(-90deg)}
.insh{padding:26px 20px;color:var(--sec);font-size:15px;text-align:center}

/* Seiten im Detail-Bereich */
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--wall) fixed;transition:transform var(--sd) var(--spring),opacity .3s}
.page.under{transform:translateX(-28%);opacity:.55;pointer-events:none}
.nav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;padding:env(safe-area-inset-top) 8px 0;background:var(--glass);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-bottom:.5px solid var(--sep);z-index:2}
.nav .ttl{font-weight:600;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:flex;align-items:center;gap:2px;color:var(--blue);padding:10px 8px}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1)}
.body{flex:1;overflow-y:auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto}

/* Gruppen und Zeilen */
.sec{margin:0 0 26px}
.sh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;text-transform:uppercase;color:var(--sec);margin:0 16px 7px;letter-spacing:.2px}
.sh button{color:var(--blue);text-transform:none;font-size:15px}
.sf{font-size:13px;color:var(--sec);margin:7px 16px 0}
.grp{background:var(--grp);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-radius:24px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:11px 16px;width:100%}
.row+.row::before,.quick+.row::before,.dep .row:first-child::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--sep)}
.row .l{flex:1;min-width:0}
.two{display:flex;flex-direction:column}
.two small{color:var(--sec);font-size:13px}
.two b{font-weight:500}
.row .v{display:flex;align-items:center;gap:6px;color:var(--sec);margin-left:auto;min-width:0}
.row .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row input.r{text-align:right;color:var(--sec);min-width:0;flex:1;width:50%}
.row input[type=number]{-moz-appearance:textfield}
.row input[type=number]::-webkit-inner-spin-button,.row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.row.btn{color:var(--blue)}.row.red{color:var(--red)}.row.c{justify-content:center}
.row .go{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:0}
button.row:active,label.row:active{background:var(--fill)}
.chev{width:14px;height:14px;stroke:var(--sec);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:.6;flex:none}
.plus{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:2.2;stroke-linecap:round}
.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.sel-row{background:#007aff26}
.ico{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.ico svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:9px;height:9px;border-radius:50%;background:#8e8e93;flex:none}.dot.on{background:var(--green)}
.dep{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--sd) var(--spring)}
.dep.off{grid-template-rows:0fr}.dep>div{overflow:hidden}

/* Schalter, Regler, Segment */
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:background .3s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0003;transition:transform var(--sd) var(--spring)}
.sw input:checked+i{background:var(--green)}.sw input:checked+i::after{transform:translateX(20px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:28px;background:none;flex:none;margin-right:8px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--fill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:27px;height:27px;border-radius:50%;background:#fff;margin-top:-11.5px;box-shadow:0 2px 8px #0004}
input[type=time]{color:var(--sec);text-align:right}
input::-webkit-calendar-picker-indicator{display:none!important}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:12px 16px}
.seg button{flex:1;text-align:center;padding:6px 4px;border-radius:8px;font-size:15px;transition:background .25s,box-shadow .25s}
.seg button.on{background:#fff;color:#000;font-weight:600;box-shadow:0 2px 6px #0002}

/* Schnellaktionen (Press = Scale wie auf dem Display) */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;text-align:center;transition:scale var(--sd) var(--spring)}
.q:active{scale:.94;transition:scale .12s ease-out}
.q:disabled{opacity:.35;pointer-events:none}
.qi{width:54px;height:54px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.qi svg{width:26px;height:26px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Hero / Face-Vorschau / Farben */
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 24px}
.hero .ico{width:72px;height:72px;border-radius:19px;margin-bottom:8px}.hero .ico svg{width:42px;height:42px}
.hero h2{margin:0;font:700 26px/1.2 -apple-system,Inter,system-ui,sans-serif}.hero p{margin:0;color:var(--sec)}
.prev{height:120px;border-radius:24px;display:grid;place-items:center;margin:4px 0 26px;transition:background .4s}
.prev .ico{width:54px;height:54px;border-radius:15px;background:#ffffff38!important;backdrop-filter:blur(16px)}.prev .ico svg{width:30px;height:30px}
.sw-grid{display:flex;flex-wrap:wrap;gap:12px 14px;padding:14px 16px}
.sw-grid button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--sec);width:58px;transition:scale var(--sd) var(--spring)}
.sw-grid button:active{scale:.92;transition:scale .12s}
.sw-grid i{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 .5px #0003;transition:box-shadow .25s}
.sw-grid .on i{box-shadow:inset 0 0 0 .5px #0003,0 0 0 2.5px var(--bg),0 0 0 4.5px var(--blue)}
.sw-grid .on{color:var(--fg)}
.minus{width:22px;height:22px;border-radius:50%;background:var(--red);flex:none;display:grid;place-items:center}
.minus::after{content:"";width:11px;height:2px;background:#fff;border-radius:1px}
.arrows{display:flex;gap:4px}.arrows button{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.arrows button:active{background:var(--fill)}.arrows svg{width:16px;height:16px;stroke:var(--blue);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.shot{display:block;width:calc(100% - 24px);margin:0 12px 12px;border-radius:16px;border:.5px solid var(--sep)}
.tilecard{margin-bottom:14px}
.tilebar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 6px 16px;min-height:46px;position:relative}
.tilebar::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--sep)}

/* Sheet, Alert, Toast */
#ov{position:fixed;inset:0;z-index:20;background:#0006;display:flex;opacity:0;transition:opacity .25s}
#ov.in{opacity:1}
#ov.alert{align-items:center;justify-content:center}
#ov.sheet{align-items:flex-end;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
.al{width:min(300px,86vw);border-radius:28px;background:var(--glass);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);text-align:center;overflow:hidden;transform:scale(1.12);transition:transform var(--sd) var(--spring)}
#ov.in .al{transform:none}
.al h4{margin:0;padding:20px 18px 4px;font-size:17px;font-weight:600}.al p{margin:0;padding:0 18px 18px;font-size:13px}
.ab{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:.5px solid var(--sep)}
.ab button{padding:14px 6px;text-align:center;color:var(--blue)}.ab button+button{border-left:.5px solid var(--sep);font-weight:600}
.ab button.red{color:var(--red)}.ab button:active{background:var(--fill)}
.shs{width:min(560px,100%);transform:translateY(110%);transition:transform var(--sd) var(--spring)}
#ov.in .shs{transform:none}
.shs .grp{margin-bottom:10px;background:var(--glass);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8)}
.ico{color:#fff}
.ig{display:flex;flex-wrap:wrap;gap:10px;padding:14px}.ig button{width:52px;height:52px;border-radius:14px;background:var(--fill);display:grid;place-items:center}
.ig button.on{box-shadow:0 0 0 2.5px var(--blue)}.ig svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg2{display:flex;align-items:center;gap:8px;color:var(--sec)}
textarea.r{text-align:right}
#ov.pkov{align-items:flex-end;justify-content:center}
.pk{width:min(620px,100%);height:min(700px,92dvh);display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--glass);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);overflow:hidden;transform:translateY(12%);transition:transform var(--sd) var(--spring)}
#ov.in .pk{transform:none}
@media(min-width:820px){#ov.pkov{align-items:center}.pk{border-radius:28px}}
.pkh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}.pkh b{font-size:17px;font-weight:600}.pkh button{color:var(--blue)}
.pks{display:flex;align-items:center;gap:8px;margin:6px 14px;padding:0 10px;height:38px;border-radius:12px;background:var(--fill)}
.pks input{flex:1;min-width:0;-webkit-appearance:none;appearance:none}.pks input::-webkit-search-cancel-button{display:none}
.pkc{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}.pkc:empty{display:none}
.pkc button{flex:none;padding:6px 12px;border-radius:16px;background:var(--fill);font-size:14px;white-space:nowrap}.pkc small{opacity:.6}
.pkc .on{background:var(--blue);color:#fff}
.pkl{flex:1;overflow-y:auto;overscroll-behavior:contain;border-top:.5px solid var(--sep)}
.pki{display:flex;align-items:center;gap:12px;width:100%;padding:9px 16px;position:relative}.pki.hi{background:var(--fill)}
.pki+.pki::before{content:"";position:absolute;left:58px;right:0;top:0;border-top:.5px solid var(--sep)}
.pki .t{flex:1;min-width:0;display:flex;flex-direction:column}.pki .t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pki small{color:var(--sec);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pki .r{display:flex;flex-direction:column;align-items:flex-end;min-width:0;max-width:42%}.pki .id{font-size:11px;opacity:.8}
@media(max-width:520px){.pki .id{display:none}}
.pki .ok{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pkn{padding:28px 16px;text-align:center;color:var(--sec);font-size:15px}
.pkf{flex:none;padding:14px;text-align:center;color:var(--blue);border-top:.5px solid var(--sep);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#toast{position:fixed;top:max(env(safe-area-inset-top),12px);left:50%;transform:translate(-50%,-220%);opacity:0;z-index:30;padding:9px 18px;border-radius:22px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);font-size:15px;font-weight:500;box-shadow:0 6px 24px #0002;transition:transform var(--sd) var(--spring),opacity .2s}
#toast.show{transform:translate(-50%,6px);opacity:1}#toast.bad{color:var(--red)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-updown" viewBox="0 0 24 24"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>

  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>

  <symbol id="i-disp" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="12" rx="3"/><path d="M9 20h6M12 16.5V20"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-cover" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 9h16M4 14h16"/></symbol>
  <symbol id="i-thermo" viewBox="0 0 24 24"><path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
  <symbol id="i-fan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6"/><path d="M12 10.4C12 6 14 4 16 4s2.5 2.5-.5 4.5M13.6 12c4.4 0 6.4 2 6.4 4s-2.5 2.5-4.5-.5M12 13.6C12 18 10 20 8 20s-2.5-2.5.5-4.5M10.4 12C6 12 4 10 4 8s2.5-2.5 4.5.5"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/></symbol>
  <symbol id="i-script" viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7zM10 9h6M10 13h6"/></symbol>
  <symbol id="i-switch" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"/><circle cx="8" cy="12" r="2"/></symbol>

</defs></svg>

<div id="app" data-open="0">
  <aside id="side"></aside>
  <main id="pane"></main>
  <aside id="pv"><div class="pvh"><b id="pvt"></b><button class="pvx" data-a="edone">Fertig</button></div><iframe id="pvf" title="Vorschau"></iframe><div id="pvfaces"></div><div id="insw"><section class="page" id="ins"></section></div></aside>
</div>
<div id="toast"></div>

<script type="module">
import { ICON, faceId, normFaces, pack, rows } from './faces.js';
import { DOM, entOf, entsOf, loadEntities, pickEntity } from './entpicker.js';
// Einstellungsseite: Seitenleiste mit allen Displays → Display → Face (Kacheln). Läuft als Admin-Panel in HA
// (gleicher Login wie das Panel, Tokens im localStorage).
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Feder wie im Display (SwiftUI .spring(response .5, damping .86)) → CSS linear()
function spring(response = .5, damping = .86, n = 48) {
  const w = 2 * Math.PI / response, z = damping, wd = w * Math.sqrt(1 - z * z), T = -Math.log(.001) / (z * w);
  const x = t => 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + z * w / wd * Math.sin(wd * t));
  return [`linear(${Array.from({ length: n + 1 }, (_, i) => +x(i / n * T).toFixed(4)).join()})`, Math.round(T * 1000)];
}
const [SPRING, SD] = spring();
document.documentElement.style.setProperty('--spring', SPRING);
document.documentElement.style.setProperty('--sd', SD + 'ms');

const FACE = {
  grid: ['Smart Home', '#ff9500', 'grid'], music: ['Musik', '#ff2d55', 'music'], bigclock: ['Uhr digital', '#636366', 'clock'], analog: ['Uhr analog', '#5856d6', 'clock'],
  calendar: ['Kalender', '#ff3b30', 'cal'], date: ['Datum', '#8e8e93', 'cal'], weather: ['Wetter', '#32ade6', 'sun'], energy: ['Energie', '#34c759', 'bolt'], info: ['Info', '#30b0c7', 'info'], cams: ['Kameras', '#8e8e93', 'cam'],
};
const TYPES = Object.entries(FACE).map(([k, v]) => [k, v[0]]);
const BG = [['auto', 'Tageszeit'], ['black', 'Schwarz'], ['white', 'Weiß'], ['metal', 'Metall'], [30, 'Orange'], [5, 'Rot'], [340, 'Rosa'], [285, 'Violett'], [307, 'Pink'], [228, 'Blau'], [205, 'Türkis'], [212, 'Himmel'], [150, 'Grün']];
const STYLES = { weather: [['', 'Kompakt'], ['cond', 'Bedingungen']], bigclock: [['stack', 'Gestapelt'], ['line', 'Lavalampe']], analog: [['big', 'Große Ziffern'], ['relief', 'Relief']], info: [['events', 'Termine'], ['music', 'Musik']] };
const LEGACY = { bigclock: [['depth', 'Tiefe']], analog: [['numbers', 'Zahlen'], ['ticks', 'Striche'], ['minimal', 'Minimal']] };   // ohne Vorlage: nur sichtbar, wenn gespeichert
const WAKE = [['off', 'Aus'], ['hey_jarvis', 'Hey Jarvis'], ['alexa', 'Alexa']];
const bgCss = bg => bg === 'auto' ? 'linear-gradient(135deg,#ffb36b,#5a6bb5)' : bg === 'black' ? '#1c1c1e' : bg === 'white' ? '#f2f2f7' : bg === 'metal' ? 'linear-gradient(135deg,#b5c4d6,#8795ad)' : typeof bg === 'number' ? `linear-gradient(135deg,hsl(${bg} 75% 66%),hsl(${bg + 25} 70% 52%))` : '#8e8e93';
const bgName = bg => BG.find(b => String(b[0]) === String(bg))?.[1] || 'Foto';
const bgVal = v => /^\d+$/.test(v) ? +v : v;

const ico = (id, c = '#007aff') => `<span class="ico" style="background:${c}"><svg><use href="#i-${id}"/></svg></span>`;
const svg = (id, cls = 'chev') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const opt = (list, v) => list.map(([k, n]) => `<option value="${esc(k)}"${String(k) === String(v) ? ' selected' : ''}>${esc(n)}</option>`).join('');
const grp = (h, rows, f = '') => `<div class="sec">${h ? `<div class="sh">${h}</div>` : ''}<div class="grp">${rows}</div>${f ? `<div class="sf">${f}</div>` : ''}</div>`;
const pick = (label, key, list, v, attr = 'data-s') => `<label class="row pick"><span class="l">${label}</span><span class="v"><span class="val">${esc(list.find(x => String(x[0]) === String(v))?.[1] ?? v)}</span>${svg('updown')}</span><select ${attr}="${key}">${opt(list, v)}</select></label>`;
const toggle = (label, key, on) => `<div class="row"><span class="l">${label}</span><label class="sw"><input type="checkbox" data-s="${key}" ${on ? 'checked' : ''}><i></i></label></div>`;
const slider = (label, key, lo, hi, step, v) => `<div class="row"><span class="l">${label}</span><span class="v"><input type="range" data-s="${key}" min="${lo}" max="${hi}" step="${step}" value="${v}"><span class="val" style="min-width:42px;text-align:right">${v} %</span></span></div>`;
const field = (label, key, v, extra = '', attr = 'data-s') => `<label class="row"><span class="l">${label}</span><input class="r" ${attr}="${key}" value="${esc(v)}" ${extra}></label>`;

const shots = {};   // letztes Bildschirmfoto je Display
let conn, displays = [], sel = null, cfg = null, pipelines = [], ttss = [];
let camState = { cameras: { list: [], bell: null }, auto: true }, camEnts = [];   // Kameras und Klingel gelten für alle Displays
let stack = [];   // Seiten im Detail-Bereich: { t: 'display' } | { t: 'face', i }
const call = (type, p = {}) => conn.sendMessagePromise({ type: 'homeblick/' + type, ...p });
const cur = () => displays.find(d => d.id === sel);
const wide = () => matchMedia('(min-width:820px)').matches;

// ---- Rückmeldung ----
let tt;
let area = '';   // Ziel der Gruppenaktionen: '' = alle, sonst Bereichsname
const inArea = () => displays.filter(x => !area || x.area === area);
function toast(t, bad) { const e = $('#toast'); e.textContent = t; e.classList.toggle('bad', !!bad); e.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('show'), 1600); }
const guard = p => p.then(r => (toast('Gespeichert'), r), e => (toast(e?.message || 'Fehler', true), Promise.reject(e)));
// Alert / Sheet; löst mit dem data-r der angetippten Schaltfläche auf (null = Hintergrund)
function overlay(kind, inner) {
  return new Promise(res => {
    const o = Object.assign(document.createElement('div'), { id: 'ov', className: kind, innerHTML: inner });
    const done = v => { o.classList.remove('in'); setTimeout(() => o.remove(), 300); res(v); };
    o.onclick = e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r); else if (e.target === o) done(null); };
    document.body.append(o); requestAnimationFrame(() => o.classList.add('in'));
  });
}
const ask = async (title, msg, ok, danger = true) => await overlay('alert', `<div class="al"><h4>${esc(title)}</h4><p>${esc(msg)}</p><div class="ab"><button data-r="">Abbrechen</button><button data-r="1" class="${danger ? 'red' : ''}">${esc(ok)}</button></div></div>`) === '1';

// ---- Speichern: Einstellungen sofort, Faces leicht verzögert ----
let st;
const saveCfg = () => { pvSend(); clearTimeout(st); st = setTimeout(() => guard(call('admin_config', { display: sel, config: cfg })).catch(() => {}), 500); };

// ---- Anzeigeteile ----
const ago = iso => {
  if (!iso) return '–';
  const s = (Date.now() - new Date(iso)) / 1000;
  return s < 90 ? 'gerade eben' : s < 3600 ? `vor ${Math.round(s / 60)} Min` : s < 86400 ? `vor ${Math.round(s / 3600)} Std` : `vor ${Math.round(s / 86400)} Tagen`;
};
const stat = d => d.connected ? `Online${d.face ? ' · ' + (FACE[d.face]?.[0] || d.face) + (d.saver ? ' (Bildschirmschoner)' : '') : ''}` : `Offline${d.seen ? ' · ' + ago(d.seen) : ''}`;

function liveHTML(d) {
  const i = d.info || {}, row = (l, v, on) => `<div class="row"><span class="l">${l}</span><span class="v">${on != null ? `<span class="dot ${on ? 'on' : ''}"></span>` : ''}${v}</span></div>`;
  return grp('Laufend', d.seen ? [
    row('Verbindung', d.connected ? 'Online' : 'Offline', d.connected),
    row('Mikrofon', i.mic ? 'Verfügbar' : i.secure === false ? 'Braucht https' : 'Nicht verfügbar', !!i.mic),
    row('Wake Word', i.wake ? 'Hört zu · ' + esc(i.wake.replace(/_v.*/, '')) : 'Aus', !!i.wake),
    row('Bildschirm wach', i.wakelock ? 'Aktiv' : i.secure === false ? 'Braucht https' : 'Aus', !!i.wakelock),
    row('Fenster', i.w ? `${esc(i.w)} × ${esc(i.h)}${i.visible === false ? ' · verdeckt' : ''}` : '–'),
    row('Zuletzt gesehen', ago(d.seen)),
    i.v ? row('Version', esc(i.v) + (d.outdated ? ' · veraltet' : ''), !d.outdated) : '',
  ].join('') : row('Noch nie verbunden', '–'), 'Zustand des geöffneten Displays, alle 30 Sekunden aktualisiert.')
    + (d.logs?.length ? grp('Letzte Fehler', d.logs.slice().reverse().map(m => `<div class="row"><span class="l two"><b>${esc(m.message)}</b><small>${m.level === 'error' ? 'Fehler' : 'Warnung'} · ${ago(m.t)}</small></span></div>`).join(''),
      'Stehen auch im Home-Assistant-Protokoll. Diagnose: Gerät des Displays → ⋮ → Diagnose herunterladen.') : '');
}

// Hinweise: was an einem Display gerade nicht stimmt (Tipp öffnet das Display)
const issues = d => {
  const i = d.info || {}, day = Date.now() - 864e5, err = (d.logs || []).filter(m => m.level === 'error' && new Date(m.t) > day).length;
  return [!d.connected && d.seen && `Offline seit ${ago(d.seen).replace(/^vor /, '')}`,
    d.connected && i.secure === false && 'Ohne https: kein Mikrofon, Bildschirm geht aus',
    d.connected && i.visible === false && 'Fenster verdeckt',
    d.windows > 1 && `${d.windows} Fenster mit derselben Display-ID offen (jedes Gerät braucht eine eigene, ?display=)`,
    d.connected && d.outdated && 'Alte Version geladen, Seite neu laden',
    err && `${err} Fehler in den letzten 24 Std`].filter(Boolean);
};

function listHTML() {
  const warn = displays.map(d => [d, issues(d)]).filter(x => x[1].length)
    .map(([d, l]) => `<button class="row" data-d="${esc(d.id)}">${ico('disp')}<span class="l two"><b>${esc(d.name)}</b><small>${esc(l.join(' · '))}</small></span>${svg('chev')}</button>`).join('');
  const rows = displays.map(d => `<button class="row ${d.id === sel ? 'sel-row' : ''}" data-d="${esc(d.id)}">${ico('disp')}<span class="l two"><b>${esc(d.name)}</b><small>${esc(stat(d))}</small></span><span class="dot ${d.connected ? 'on' : ''}"></span>${svg('chev')}</button>`).join('');
  const areas = [...new Set(displays.map(x => x.area).filter(Boolean))].sort();
  if (!areas.includes(area)) area = '';
  const on = inArea().filter(x => x.connected).length, dis = on ? '' : 'disabled';
  const allGrp = displays.length > 1 ? grp(`${area ? esc(area) : 'Alle Displays'} · ${on} online`, (areas.length ? pick('Bereich', 'area', [['', 'Alle'], ...areas.map(a => [a, a])], area, 'data-area') : '') + `<div class="quick">${[['reload', 'Neu laden', 'refresh'], ['assist', 'Assist', 'mic'], ['stop', 'Abbrechen', 'x'], ['screensaver', 'Ruhemodus', 'moon'], ['wake', 'Aufwecken', 'sun']].map(([c, n, i]) => `<button class="q" data-all="${c}" ${dis}><span class="qi">${svg(i, '')}</span>${n}</button>`).join('')}</div>`
    + field('Zurück nach (s, leer = bleibt)', 'dur', '', 'type="number" inputmode="numeric" min="1" max="3600"', 'data-dur')
    + pick('Face anzeigen', 'allface', [['', 'Wählen …'], ...TYPES], '', 'data-allface')
    + `<button class="row btn" data-alls="1"><span class="l">Nachtmodus auf allen an</span></button><button class="row btn" data-alls="0"><span class="l">Nachtmodus auf allen aus</span></button>`, `Befehle gehen an alle Displays${area ? ` im Bereich „${esc(area)}“` : ''}, die gerade geöffnet sind.${areas.length ? '' : ' Bekommen die Display-Geräte in Home Assistant einen Bereich, lassen sich die Befehle auf einen Bereich beschränken.'}`) : '';
  return `<div class="lt">Homeblick</div><div class="lsub">Displays im Haus</div>` +
    (displays.length ? (warn ? grp('Hinweise', warn) : '') + grp('Displays', rows, 'Ein Display legt sich an, sobald Homeblick einmal auf dem Gerät geöffnet wurde.') + allGrp
      : grp('', `<div class="row"><span class="l">Noch kein Display angemeldet</span></div>`, 'Öffne Homeblick auf dem Gerät, am besten mit <code>?display=kueche&amp;name=Küche</code> hinter der Adresse.'));
}

// ---- Kameras + Klingel (global) ----
const camName = x => x.name || camEnts.find(c => c[0] === x.entity)?.[1] || x.entity;
function camsHTML() {
  const { cameras: c, auto } = camState;
  const row = (x, i) => `<div class="grp tilecard" data-ci="${i}">
    ${field('Name', 'name', x.name, `maxlength="40" placeholder="${esc(camEnts.find(k => k[0] === x.entity)?.[1] || '')}"`, 'data-cam')}
    ${epick('Kamera', 'entity', x.entity, { domains: ['camera'] }, 'data-cam')}
    ${epick('Licht davor', 'light', x.light || '', { domains: ['light'], none: 'Keins' }, 'data-cam')}
    ${field('go2rtc-Adresse (optional)', 'go2rtc', x.go2rtc || '', 'placeholder="http://192.168.1.10:1984" inputmode="url" maxlength="200"', 'data-cam')}
    ${x.go2rtc ? field('go2rtc-Stream', 'stream', x.stream || '', `placeholder="${esc(x.entity.split('.')[1] || '')}" maxlength="80"`, 'data-cam') : ''}
    <div class="tilebar"><span class="arrows"><button data-a="cup" aria-label="Nach oben">${svg('up', '')}</button><button data-a="cdown" aria-label="Nach unten">${svg('down', '')}</button></span><button data-a="cdel" style="color:var(--red);padding:8px 10px">Entfernen</button></div></div>`;
  return `<div class="sec"><div class="sh"><span>Kameras</span></div>${c.list.map(row).join('')}
      <div class="grp"><button class="row btn" data-a="cadd">${svg('plus', 'plus')}<span class="l">Kamera hinzufügen</span></button></div>
      <div class="sf">${auto ? 'Automatisch erkannt: alle Kameras von Home Assistant. Jede Änderung hier legt die Liste fest.' : 'Das Face „Kameras“ zeigt bis zu vier Kameras als 2×2-Raster, die Klingelkamera (sonst die erste) zuerst.'} Das Bild läuft über Home Assistant (WebRTC, sonst HLS oder Standbilder).</div></div>`
    + grp('Türklingel', epick('Klingel-Ereignis', 'event', c.bell?.event || '', { domains: ['event'], none: 'Keine' }, 'data-bell')
      + pick('Kamera der Klingel', 'camera', [['', 'Keine'], ...c.list.map(x => [x.entity, camName(x)])], c.bell?.camera || '', 'data-bell')
      + epick('Schloss zum Öffnen', 'lock', c.bell?.lock || '', { domains: ['lock'], none: 'Keins' }, 'data-bell')
      + pick('Bild vorhalten', 'warm', [['0', 'Nein'], ['1', 'Ja (Verbindung bleibt offen)']], c.bell?.warm ? '1' : '0', 'data-bell'),
      'Klingeln weckt alle geöffneten Displays, spielt den Gong und zeigt diese Kamera. „Tür öffnen“ braucht einen zweiten Tipp. Sprechen geht nur, wenn die Kamera (go2rtc) einen Rückkanal hat und die Seite über https läuft. Über go2rtc ist das Bild nach ca. 0,3 s da; „Vorhalten“ hält zusätzlich eine Videoverbindung offen. Gilt für alle Displays.')
    + (auto ? '' : grp('', `<button class="row btn c" data-a="creset">Automatisch erkennen</button>`));
}
let cst;
const saveCams = () => {
  clearTimeout(cst); camState.auto = false;
  const { list, bell } = camState.cameras;   // Klingelkamera darf im Formular vor dem Ereignis gewählt werden; gespeichert wird erst mit Ereignis
  cst = setTimeout(() => guard(call('set_cameras', { cameras: { list, bell: bell?.event ? bell : null } })).catch(() => {}), 500);
};
function camEdit(t) {
  const c = camState.cameras;
  if (t.dataset.bell) {
    c.bell = { event: '', camera: '', lock: '', warm: false, ...c.bell, [t.dataset.bell]: t.dataset.bell === 'warm' ? t.value === '1' : t.value };
  } else {
    const x = c.list[+t.closest('[data-ci]').dataset.ci], old = x.entity;
    const had = !!x.go2rtc;
    x[t.dataset.cam] = t.value.trim();
    if (t.dataset.cam === 'go2rtc' && had !== !!x.go2rtc) { saveCams(); return redraw(); }   // Feld „go2rtc-Stream“ ein-/ausblenden
    if (t.dataset.cam === 'entity' && c.bell?.camera === old) c.bell.camera = x.entity;   // Klingel folgt der getauschten Kamera
    saveCams();
    if (t.dataset.cam === 'entity') redraw();   // Auswahl „Kamera der Klingel“ neu aufbauen
    return;
  }
  saveCams();
}
async function camAction(a, i) {
  const c = camState.cameras;
  if (a === 'creset') { clearTimeout(cst); await guard(call('set_cameras', { cameras: null })); camState = await call('cameras'); return redraw(); }
  if (a === 'cadd') {
    const e = (camEnts.find(k => !c.list.some(x => x.entity === k[0])) || [])[0];
    if (!e) return toast(camEnts.length ? 'Alle Kameras sind schon in der Liste' : 'Keine Kamera in Home Assistant', true);
    if (c.list.length >= 8) return toast('Höchstens 8 Kameras', true);
    c.list.push({ entity: e, name: '', light: '' });
  } else if (a === 'cup' || a === 'cdown') swap(c.list, i, i + (a === 'cup' ? -1 : 1));
  else if (a === 'cdel') { const [x] = c.list.splice(i, 1); if (c.bell?.camera === x.entity) c.bell.camera = ''; }
  saveCams(); redraw();
}

// ---- Seiten ----
const pages = {
  display() {
    const d = cur(), s = d.settings, faces = cfg?.faces;
    const body = `
      <div class="hero">${ico('disp')}<h2 data-live="name">${esc(d.name)}</h2><p data-live="stat">${esc(stat(d))}</p></div>
      ${grp('', field('Name', 'name', d.name))}
      ${faces ? `<div class="sec edbtn"><div class="grp"><button class="row btn c" data-a="edit">Anzeige bearbeiten</button></div><div class="sf">Faces, Kacheln, Hintergründe und Entities stellst du live in der Vorschau ein.</div></div>` : grp('', `<div class="row"><span class="l" style="color:var(--sec)">Noch keine Konfiguration. Öffne Homeblick einmal auf dem Gerät.</span></div>`)}
      <div class="sec"><div class="grp"><div class="quick">${[['reload', 'Neu laden', 'refresh'], ['assist', 'Assist', 'mic'], ['stop', 'Abbrechen', 'x'], ['screensaver', 'Ruhemodus', 'moon'], ['wake', 'Aufwecken', 'sun']].map(([c, n, i]) => `<button class="q" data-c="${c}" ${d.connected ? '' : 'disabled'}><span class="qi">${svg(i, '')}</span>${n}</button>`).join('')}</div>
        ${field('Zurück nach (s, leer = bleibt)', 'dur', '', 'type="number" inputmode="numeric" min="1" max="3600"', 'data-dur')}
        ${pick('Face anzeigen', 'show', [['', 'Wählen …'], ...TYPES], '', 'data-show')}</div><div class="sf">Die Steuerung geht, solange das Display geöffnet ist.</div></div>
      ${grp('Ansage', field('Text', 'say', '', 'placeholder="Das Essen ist fertig" maxlength="300"', 'data-say') + `<button class="row btn c" data-a="say" ${d.connected ? '' : 'disabled style="opacity:.4"'}>Auf dem Display ansagen</button><button class="row btn c" data-a="testnb" ${d.connected ? '' : 'disabled style="opacity:.4"'}>Testbenachrichtigung zeigen</button>`, 'Erscheint als Text und wird gesprochen (außer bei „Antworten stumm“). In Automationen: Aktion „Benachrichtigung senden“ (notify.send_message) an die Durchsage-Entity des Displays. Die weiße Karte mit Titel, Bild und Button kommt von der Aktion „Benachrichtigung zeigen“ (homeblick.notify).')}
      ${grp('Vorschau', `<button class="row btn c" data-a="shot" ${d.connected ? '' : 'disabled style="opacity:.4"'}>Bildschirmfoto aufnehmen</button>${shots[d.id] ? `<img class="shot" src="${shots[d.id]}" alt="">` : ''}`, 'Bilder von fremden Servern, Kamera-Video und WebGL fehlen im Foto.')}
      ${grp('Bildschirmschoner', field('Nach Inaktivität (s)', 'idle', s.idle, 'type="number" inputmode="numeric" min="0" max="3600" step="10"') + pick('Face', 'saver', faces ? TYPES.filter(([t]) => t === s.saver || faces.some(f => f.type === t)) : TYPES, s.saver) + toggle('Musik statt Bildschirmschoner', 'music', s.music) + toggle('Ganz schwarz statt Face', 'black', s.black) + toggle('Zeitplan', 'sched', s.sched) + `<div class="dep ${s.sched ? '' : 'off'}" id="schdep"><div>
        <label class="row"><span class="l">Von</span><input type="time" data-s="sched_from" value="${esc(s.sched_from.slice(0, 5))}"></label>
        <label class="row"><span class="l">Bis</span><input type="time" data-s="sched_to" value="${esc(s.sched_to.slice(0, 5))}"></label></div></div>`, 'Im Zeitplan startet der Bildschirmschoner nach 30 Sekunden Ruhe, auch wenn die Inaktivitätszeit 0 ist. 0 schaltet den Bildschirmschoner aus. Läuft Musik, erscheint stattdessen das Musik-Face.')}
      ${grp('Mikrofon stumm', toggle('Mikrofon stumm', 'micmute', s.micmute), 'Schaltet das Wake Word aus; Assist per Tippen funktioniert weiter.')}
      ${grp('Nicht stören', toggle('Nicht stören', 'dnd', s.dnd), 'Wake Word, gesprochene Antworten und Klingelgong aus; Texte und Tippen bleiben.')}
      ${grp('Schoner halten', toggle('Schoner halten', 'hold', s.hold), 'Solange aktiv, startet der Bildschirmschoner nicht (z. B. beim Kochen oder Präsentieren).')}
      ${grp('Leistung', toggle('Leistungsmodus', 'perf', s.perf), 'Schaltet Animationen und Übergänge auf diesem Display ab – für schwache Tablets.')}
      ${grp('Helligkeit', slider('Helligkeit', 'bright', 10, 100, 5, s.bright), 'Software-Abdunklung, keine Hardware-Helligkeit.')}
      ${grp('Kontrollzentrum', toggle('Kontrollzentrum', 'kz', s.kz), 'Wisch von oben rechts über mindestens 40 % der Höhe: Helligkeit, Lautstärke, Schalter und Kacheln (Türen, Szenen, Lichter aus den Home-Faces). Schließen: Wisch hoch unten rechts, Tippen daneben oder Escape.')}
      ${grp('Nachtmodus', toggle('Nachts abdunkeln', 'dim', s.dim) + `<div class="dep ${s.dim ? '' : 'off'}" id="dimdep"><div>
        <label class="row"><span class="l">Von</span><input type="time" data-s="dim_from" value="${esc(s.dim_from.slice(0, 5))}"></label>

// Kachel j so einsortieren, dass sie auf Rasterzelle (r, c) landet; sonst die nächstliegende mögliche Stelle
function moveTo(tiles, j, [r, c], n) {
  const t = tiles[j], rest = tiles.filter((_, k) => k !== j);
  let best = j, bd = Infinity;
  for (let k = 0; k <= rest.length; k++) {
    const p = pack([...rest.slice(0, k), t, ...rest.slice(k)], n)[k];
    if (!p) continue;
    const d = (p[0] - r) ** 2 + (p[1] - c) ** 2;
    if (d < bd || (d === bd && Math.abs(k - j) < Math.abs(best - j))) { bd = d; best = k; }
  }
  return [...rest.slice(0, best), t, ...rest.slice(best)];
}

    const i = cfg?.faces.findIndex(x => x.id === m.face);
    if (i < 0 || i == null) return;
    const f = cfg.faces[i];

      v = v.trim(); if (!v) return;
      await guard(call('update', { display: sel, name: v })); d.name = v; renderSide();
      pane().querySelectorAll('[data-live=name]').forEach(x => x.textContent = v);
      pane().querySelectorAll('.ttl').forEach((x, i) => stack[i].t === 'display' && (x.textContent = v)); return;
    }
    if (k === 'dim') $('#dimdep').classList.toggle('off', !v);
    if (k === 'sched') $('#schdep').classList.toggle('off', !v);
    d.settings[k] = v; guard(call('update', { display: sel, settings: { [k]: v } })).catch(() => {});
  } else if (t.dataset.f) {   // Face-Feld (Pfad wie „ents.pv“)
    const f = cfg.faces[ctx().i];
    setPath(f, t.dataset.f, t.value.trim() || undefined);
    if (f.ents && !Object.keys(f.ents).length) delete f.ents;
    saveCfg();
  } else if (t.dataset.fcal) {   // Kalender-Auswahl: alle = nicht gesetzt
    const f = cfg.faces[ctx().i], all = entsOf('calendar').map(e => e.id);
    let c = f.cals || all; c = t.checked ? [...new Set([...c, t.dataset.fcal])] : c.filter(x => x !== t.dataset.fcal);
    if (!c.length) { t.checked = true; return toast('Mindestens ein Kalender', true); }
    f.cals = c.length === all.length ? undefined : c; if (!f.cals) delete f.cals;
    saveCfg();
  } else if (t.dataset.cam || t.dataset.bell) camEdit(t);
  else if (t.dataset.t) {   // Kachel-Seite: Pfad wie „tap.service“
    const at = ctx(), tl = cfg.faces[at.i].tiles[at.j], k = t.dataset.t, [o, p] = k.split('.');
    let v = t.value.trim();
    if (p === 'do') { if (v === 'default') delete tl[o]; else tl[o] = { do: v, ...(v === 'face' && { face: cfg.faces[0].id }) }; }
    else if (p === 'data') {
      try { v = v ? JSON.parse(v) : undefined; if (v && (typeof v !== 'object' || Array.isArray(v))) throw 0; } catch { return toast('Daten müssen ein JSON-Objekt sein', true); }
      setPath(tl, k, v);
    } else setPath(tl, k, k === 'title' || k === 'sub' || v ? v : undefined);
    saveCfg(); if (p === 'do' || k === 'val') redraw();
  }
  else if (t.dataset.area !== undefined) { area = t.value; renderSide(); }
  else if (t.dataset.allface !== undefined) { if (t.value) all({ action: 'face', face: t.value, ...dur() }); t.value = ''; t.closest('.pick').querySelector('.val').textContent = 'Wählen …'; }
  else if (t.dataset.show !== undefined) { if (t.value) guard(call('command', { display: sel, action: 'face', face: t.value, ...dur() })).catch(() => {}); t.value = ''; t.closest('.pick').querySelector('.val').textContent = 'Wählen …'; }
  else if (t.dataset.copy !== undefined && t.value) copyFrom(t.value, t);
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.d) return open(b.dataset.d);
  if (b.dataset.pf) return goFace(cfg.faces.findIndex(x => x.id === b.dataset.pf));
  if (b.dataset.all) return all({ action: b.dataset.all });
  if (b.dataset.alls !== undefined) { const v = !!+b.dataset.alls; return guard(Promise.all(inArea().map(x => (x.settings.dim = v, call('update', { display: x.id, settings: { dim: v } })))).then(() => { const d = cur(); if (d) refresh(); })).catch(() => {}); }
  if (b.dataset.c) return guard(call('command', { display: sel, action: b.dataset.c, ...(b.dataset.c === 'face' && { face: cfg.faces[ctx().i].type }) })).catch(() => {});
  if (b.dataset.ep) {
    const i = b.querySelector('input'), en = await pickEntity({ ...JSON.parse(b.dataset.ep), current: i.value });
    if (en) { i.value = en.id; i.dispatchEvent(new Event('change', { bubbles: true })); refresh(); }
    return;
  }
  const a = b.dataset.a;
  if (!a) return;
  if (a === 'back') { if (b.closest('#ins')) return setIns({ t: 'face', i: ins.i }); $('#app').dataset.open = '0'; return; }
  if (a === 'edit') { $('#app').dataset.ed = '1'; pvLoad(); if (!ins) goFace(0); return; }
  if (a === 'edone') { $('#app').dataset.ed = '0'; return; }
  if (a === 'faddsheet') {   // ausgeblendetes Face wieder einblenden oder neues anlegen
    const r = await overlay('sheet', `<div class="shs">${cfg.off?.length ? `<div class="grp">${cfg.off.map(f => `<button class="row btn c" data-r="show:${esc(f.id)}">${esc(faceName(f))} einblenden</button>`).join('')}</div>` : ''}<div class="grp" style="max-height:46vh;overflow-y:auto">${TYPES.map(([t, n]) => `<button class="row btn c" data-r="new:${t}">Neu: ${esc(n)}</button>`).join('')}</div><div class="grp"><button class="row btn c" data-r="" style="font-weight:600">Abbrechen</button></div></div>`);
    if (!r) return;
    const [k, v] = r.split(':');
    if (k === 'show') cfg.faces.push(...cfg.off.splice(cfg.off.findIndex(f => f.id === v), 1));
    else cfg.faces.push({ type: v, id: faceId(cfg, v), bg: v === 'grid' ? 'auto' : 'black', ...(v === 'grid' && { tiles: [] }) });
    saveCfg(); return setIns({ t: 'face', i: cfg.faces.length - 1 });
  }
  if (/^f(left|right|dup|hide)$/.test(a)) {
    const i = ins.i, f = cfg.faces[i];
    if (a === 'fleft' || a === 'fright') { const j = i + (a === 'fleft' ? -1 : 1); if (j < 0 || j >= cfg.faces.length) return; swap(cfg.faces, i, j); ins = { t: 'face', i: j }; }
    else if (a === 'fdup') { cfg.faces.splice(i + 1, 0, { ...structuredClone(f), id: faceId(cfg, f.type) }); ins = { t: 'face', i: i + 1 }; }
    else { if (cfg.faces.length < 2) return toast('Mindestens ein Face', true); cfg.off.push(...cfg.faces.splice(i, 1)); saveCfg(); return setIns(null); }
    saveCfg(); return redraw();
  }
  if (a === 'rm') {
    if (await ask(`„${cur().name}“ entfernen?`, 'Faces und Einstellungen gehen verloren. Das Gerät in Home Assistant bitte danach unter Geräte löschen.', 'Entfernen')) { await guard(call('remove', { display: sel })); sel = null; await reload(); }
    return;
  }
  if (a === 'testnb') { const i = pane().querySelector('[data-say]'); guard(call('command', { display: sel, action: 'notify', title: 'Testbenachrichtigung', message: i.value.trim() || 'Die Benachrichtigungskarte funktioniert.' })).catch(() => {}); return; }   // Karte wie homeblick.notify, ohne Bild/Button
  if (a === 'say') { const i = pane().querySelector('[data-say]'); if (i.value.trim()) guard(call('command', { display: sel, action: 'announce', message: i.value.trim() })).then(() => i.value = '').catch(() => {}); return; }
  if (a === 'shot') {
    b.disabled = true;
    try {
      await call('command', { display: sel, action: 'screenshot' });
      for (let i = 0; i < 10; i++) {   // das Display antwortet asynchron
        await new Promise(r => setTimeout(r, 500));
        const { image } = await call('get_shot', { display: sel });
        if (image && image !== shots[sel]) { shots[sel] = image; refresh(); return; }
      }
      toast('Keine Antwort vom Display', true);
    } catch (e) { toast(e?.message || 'Fehler', true); }
    b.disabled = false; return;
  }
  if (/^c(add|up|down|del|reset)$/.test(a)) return camAction(a, +b.closest('[data-ci]')?.dataset.ci);
  if (a === 'face') return goFace(+b.closest('[data-fi]').dataset.fi);
  // Face-Seite
  const at = ctx();
  if (!at) return;
  const i = at.i, f = cfg.faces[i], tiles = f.tiles, j = at.j ?? +b.closest('[data-ti]')?.dataset.ti;
  if (a === 'bg') f.bg = bgVal(b.dataset.v);
  else if (a === 'style') f.style = b.dataset.v;
  else if (a === 'tile') return goTile(i, j);
  else if (a === 'tsize') { const t = tiles[j], [w, h] = b.dataset.v.split('x').map(Number); w > 1 ? t.w = w : delete t.w; h > 1 ? t.h = h : delete t.h; }
  else if (a === 'tcolor') b.dataset.v ? tiles[j].color = b.dataset.v : delete tiles[j].color;
  else if (a === 'ticon') {
    const t = tiles[j], r = await overlay('sheet', `<div class="shs"><div class="grp"><div class="ig">${ICONS.map(n => `<button data-r="${n}" class="${t.icon === n ? 'on' : ''}" aria-label="${n}">${xi(n)}</button>`).join('')}</div></div><div class="grp"><button class="row btn c" data-r="-">Standard-Symbol</button></div><div class="grp"><button class="row btn c" data-r="" style="font-weight:600">Abbrechen</button></div></div>`);
    if (!r) return; r === '-' ? delete t.icon : t.icon = r;
  }
  else if (a === 'tadd') { const t = await addTile(f); if (!t) return; ins = { t: 'tile', i, j: f.tiles.indexOf(t) }; }
  else if (a === 'tent') {
    const t = tiles[j], en = await pickEntity({ title: 'Entity der Kachel', domains: t.kind === 'thermo' ? ['climate'] : TILE_DOM, current: t.e });
    if (!en) return;
    const old = entOf(t.e);   // Titel/Untertitel mitführen, solange sie noch die Vorgabe der alten Entity sind
    if (!t.title || t.title === 'Neu' || (old && t.title === autoTitle(old))) t.title = autoTitle(en);
    if (!t.sub || t.sub === old?.area) t.sub = en.area;
    t.e = en.id;
    if (t.val && t.val !== 'state' && !en.attrs.includes(t.val)) delete t.val;
    for (const x of ['tap', 'hold']) if (t[x]?.do === 'toggle' && !TOGGLE_DOM.includes(en.domain)) delete t[x];
    if (en.domain === 'sensor' || en.domain === 'binary_sensor') t.val ||= 'state';
  }
  else if (a === 'tup' || a === 'tdown') swap(tiles, j, j + (a === 'tup' ? -1 : 1));
  else if (a === 'tdel') { tiles.splice(j, 1); saveCfg(); return setIns({ t: 'face', i }); }
  saveCfg(); redraw();
});

// Gruppenaktion: Befehl an alle Displays, die gerade ein Panel offen haben
const dur = () => { const n = parseInt(document.querySelector('[data-dur]')?.value, 10); return n >= 1 ? { duration: Math.min(n, 3600) } : {}; };
const all = p => guard(Promise.all(inArea().filter(x => x.connected).map(x => call('command', { display: x.id, ...p })))).catch(() => {});

async function copyFrom(id, selEl) {
  const src = displays.find(x => x.id === id);
  const ok = await ask(`Von „${src.name}“ übernehmen?`, `Faces und Einstellungen ersetzen die von „${cur().name}“. Wetter-Ort, Assist-Pipeline und Präsenzmelder bleiben.`, 'Übernehmen');
  selEl.value = ''; selEl.closest('.pick').querySelector('.val').textContent = 'Display wählen …';
  if (!ok) return;
  const { config } = await call('get_config', { display: id });
  if (!config) return toast('Quelle hat noch keine Konfiguration', true);
  const { place, weather, pipeline, presence, lux, ...s } = src.settings;
  await guard(call('admin_config', { display: sel, config }).then(() => call('update', { display: sel, settings: s }))).catch(() => {});
  await reload();
}

// ---- Verbindung & Start ----
async function connect() {
  // Im HA-Panel die Verbindung des HA-Frontends (gleicher Origin) statt eines zweiten Logins
  const p = (() => { try { return parent !== window && parent.hassConnection; } catch { return null; } })();
  if (p) return (await p).conn;
  const ha = await import('https://cdn.jsdelivr.net/npm/home-assistant-js-websocket@9.7.1/+esm');
  const auth = await ha.getAuth({ hassUrl: location.origin, saveTokens: t => localStorage.hassTokens = JSON.stringify(t), loadTokens: async () => JSON.parse(localStorage.hassTokens || 'null') });
  if (location.search.includes('auth_callback')) history.replaceState(null, '', location.pathname);
  return ha.createConnection({ auth, setupRetry: -1 });
}
async function poll() {   // Status nachführen, ohne Formulare neu zu zeichnen
  const n = await call('displays').catch(() => null);
  if (!n) return;
  if (n.length !== displays.length) return reload();
  n.forEach(x => Object.assign(displays.find(d => d.id === x.id) || {}, { connected: x.connected, face: x.face, saver: x.saver, info: x.info, seen: x.seen, logs: x.logs }));
  renderSide();
  const d = cur(); if (!d) return;
  pane().querySelectorAll('[data-live=stat]').forEach(x => x.textContent = stat(d));
  const lg = $('#liveGrp'); if (lg) lg.innerHTML = liveHTML(d);
  pane().querySelectorAll('.q,[data-c=face]').forEach(x => x.disabled = !d.connected);
}
try {
  conn = await connect();
  const [states, pl, cs] = await Promise.all([conn.sendMessagePromise({ type: 'get_states' }), conn.sendMessagePromise({ type: 'assist_pipeline/pipeline/list' }).catch(() => null), call('cameras').catch(() => null)]);
  if (cs) camState = cs;
  const nameOf = x => x.attributes.friendly_name || x.entity_id, byDomain = d => states.filter(x => x.entity_id.startsWith(d + '.')).map(x => [x.entity_id, nameOf(x)]).sort((a, b) => a[1].localeCompare(b[1], 'de'));
  camEnts = byDomain('camera');
  await loadEntities(conn, states);
  pvStates = Object.fromEntries(states.map(x => [x.entity_id, x])); setInterval(() => { if (!document.hidden) pvStatesLoad(); }, 15000);
  ttss = states.filter(x => x.entity_id.startsWith('tts.')).map(x => [x.entity_id, x.attributes.friendly_name || x.entity_id]);
  pipelines = pl?.pipelines?.map(p => [p.id, p.name]) || [];
  await reload();
  setInterval(() => { if (!document.hidden && !document.querySelector('input:focus,#ov')) poll(); }, 5000);
  matchMedia('(min-width:820px)').addEventListener('change', () => reload());
  matchMedia('(min-width:1180px)').addEventListener('change', e => { if (e.matches) pvLoad(); });
} catch (e) { $('#side').innerHTML = `<div class="lt">Homeblick</div>` + grp('', `<div class="row"><span class="l">Keine Verbindung zu Home Assistant (${esc(e?.message || e)}). Die Seite braucht ein Administrator-Konto.</span></div>`); }
</script>
